<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoreKeeper — Mythology & Folklore Chatbot</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{--bg:#0b1118;--bg2:#111a25;--card:#16202e;--card-h:#1b2840;--bdr:#243044;--fg:#e4dac6;--fg2:#94a3b8;--acc:#c4952e;--acc-h:#daa740;--acc-g:rgba(196,149,48,.12);--bot:#142030;--usr:#17304d;--ok:#2f8a50;--err:#b93e3e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--fg);overflow:hidden;height:100vh}
  h1,h2,h3,h4,.fd{font-family:'Cinzel',serif}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
  .mi{animation:ms .35s ease-out}@keyframes ms{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .td{width:8px;height:8px;background:var(--acc);border-radius:50%;animation:tb 1.2s infinite}.td:nth-child(2){animation-delay:.15s}.td:nth-child(3){animation-delay:.3s}
  @keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-8px);opacity:1}}
  .ch{transition:all .2s;cursor:pointer}.ch:hover{background:var(--acc);color:var(--bg);transform:translateY(-1px)}
  .fc{background:var(--card);border:1px solid var(--bdr);border-radius:12px;transition:border-color .2s}.fc:hover{border-color:var(--acc)}
  #sb{transition:transform .3s ease}
  @media(max-width:768px){#sb{position:fixed;z-index:50;transform:translateX(-100%)}#sb.op{transform:translateX(0)}#sov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}#sov.op{display:block}}
  .to{animation:ti .3s ease-out,tout .3s ease-in 2.7s;animation-fill-mode:forwards}
  @keyframes ti{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
  @keyframes tout{from{opacity:1}to{opacity:0;transform:translateX(40px)}}
  .ci{transition:all .2s}.ci:hover{background:var(--card-h)}
  .lg{animation:gp 3s ease-in-out infinite}@keyframes gp{0%,100%{text-shadow:0 0 8px rgba(196,149,48,.3)}50%{text-shadow:0 0 20px rgba(196,149,48,.6)}}
  #ci:focus{outline:none;box-shadow:0 0 0 2px rgba(196,149,48,.4)}
  #pc{position:fixed;inset:0;z-index:0;pointer-events:none}
  .tb2{transition:all .2s}.tb2.ac{color:var(--acc);border-bottom:2px solid var(--acc)}
  .ab{transition:all .15s}.ab:hover{background:var(--acc-g);border-color:var(--acc)}
  .sb{font-size:10px;padding:2px 8px;border-radius:9999px;display:inline-flex;align-items:center;gap:4px}
  .lb{font-size:10px;padding:2px 10px;border-radius:9999px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;transition:all .2s;border:1px solid var(--bdr)}
  .lb:hover,.lb.act{border-color:var(--acc);color:var(--acc);background:var(--acc-g)}
  .lb.act{color:var(--acc)}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="pc"></canvas>
<div id="sov" onclick="tsb(false)"></div>
<div class="flex h-screen relative z-10">
  <aside id="sb" class="w-72 flex-shrink-0 bg-[var(--bg2)] border-r border-[var(--bdr)] flex flex-col h-full">
    <div class="p-5 border-b border-[var(--bdr)]">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-[var(--acc)] to-amber-700 flex items-center justify-center"><i class="fas fa-book-open text-[var(--bg)] text-lg"></i></div>
        <div><h1 class="fd text-lg text-[var(--acc)] lg leading-tight">LoreKeeper</h1><p class="text-xs text-[var(--fg2)]">Mythology & Folklore</p></div>
      </div>
    </div>
    <div class="flex border-b border-[var(--bdr)]">
      <button class="tb2 ac flex-1 py-3 text-sm font-medium text-center" data-t="col" onclick="stb('col')"><i class="fas fa-bookmark mr-1"></i><span data-t="col_label">Collection</span></button>
      <button class="tb2 flex-1 py-3 text-sm font-medium text-center text-[var(--fg2)]" data-t="his" onclick="stb('his')"><i class="fas fa-clock-rotate-left mr-1"></i><span data-t="his_label">History</span></button>
    </div>
    <div id="tcol" class="flex-1 overflow-y-auto p-3"><div id="cl"></div></div>
    <div id="this2" class="flex-1 overflow-y-auto p-3 hidden"><div id="hl"></div></div>
    <div class="p-4 border-t border-[var(--bdr)]">
      <button onclick="cad()" class="ab w-full py-2 px-3 rounded-lg border border-[var(--bdr)] text-sm text-[var(--fg2)] hover:text-[var(--err)]"><i class="fas fa-trash-can mr-2"></i><span data-t="clear_all">Clear All</span></button>
    </div>
  </aside>
  <main class="flex-1 flex flex-col min-w-0">
    <header class="flex items-center justify-between px-4 md:px-6 py-3 border-b border-[var(--bdr)] bg-[var(--bg2)]/80 backdrop-blur-sm">
      <div class="flex items-center gap-3">
        <button onclick="tsb(true)" class="md:hidden w-9 h-9 rounded-lg border border-[var(--bdr)] flex items-center justify-center text-[var(--fg2)] hover:text-[var(--fg)]"><i class="fas fa-bars"></i></button>
        <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div><span id="status_txt" class="text-sm text-[var(--fg2)]">LoreKeeper</span></div>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex gap-1" id="lang_btns">
          <button class="lb act" onclick="setLang('en')" data-lang="en">EN</button>
          <button class="lb" onclick="setLang('fil')" data-lang="fil">FIL</button>
          <button class="lb" onclick="setLang('hil')" data-lang="hil">HIL</button>
        </div>
        <button onclick="ec()" class="w-9 h-9 rounded-lg border border-[var(--bdr)] flex items-center justify-center text-[var(--fg2)] hover:text-[var(--fg)]" title="Export"><i class="fas fa-download text-sm"></i></button>
        <button onclick="cc()" class="w-9 h-9 rounded-lg border border-[var(--bdr)] flex items-center justify-center text-[var(--fg2)] hover:text-[var(--fg)]" title="New"><i class="fas fa-plus text-sm"></i></button>
      </div>
    </header>
    <div id="cm" class="flex-1 overflow-y-auto px-4 md:px-6 py-4 space-y-4"></div>
    <div class="px-4 md:px-6 pb-4 pt-2 border-t border-[var(--bdr)] bg-[var(--bg2)]/60 backdrop-blur-sm">
      <div class="flex items-end gap-3 max-w-3xl mx-auto">
        <div class="flex-1 relative">
          <textarea id="ci" rows="1" placeholder="Ask about any myth, deity, or legend..." class="w-full resize-none rounded-xl border border-[var(--bdr)] bg-[var(--card)] px-4 py-3 pr-12 text-sm text-[var(--fg)] placeholder:text-[var(--fg2)]/50 focus:border-[var(--acc)]" onkeydown="hik(event)" oninput="ars(this)"></textarea>
          <button onclick="sm()" class="absolute right-2 bottom-2 w-8 h-8 rounded-lg bg-[var(--acc)] hover:bg-[var(--acc-h)] flex items-center justify-center text-[var(--bg)] transition-colors" aria-label="Send"><i class="fas fa-paper-plane text-sm"></i></button>
        </div>
      </div>
      <div class="flex flex-wrap gap-2 mt-3 max-w-3xl mx-auto" id="qc"></div>
    </div>
  </main>
</div>
<div id="tc" class="fixed top-4 right-4 z-[100] space-y-2"></div>

<script>
// ============================================================
// MULTILINGUAL SYSTEM
// ============================================================
let CL = 'en'; // Current language

const TR = {
  welcome_title: {en:"Welcome, Seeker",fil:"Maligayang Pagdating, Manghahalukay",hil:"Malipayon nga Pag-abot, Mangita"},
  welcome_body: {en:"I am LoreKeeper, the ancient guardian of myths, legends, and folklore from cultures across the world. Ask me about any deity, hero, creature, or legend — or say \"guide me\" and I shall illuminate the paths that await you.",
    fil:"Ako si LoreKeeper, ang sinaunang tagapangalaga ng mga mito, alamat, at kuwentong-bayan mula sa iba't ibang kultura sa buong mundo. Itanong mo sa akin ang tungkol sa anumang diyos, bayani, nilalang, o alamat — o sabihin mo lang \"giya mo ako\" at iilawan ko ang mga daang naghihintay sa iyo.",
    hil:"Ako si LoreKeeper, ang daan nga tagapangalaga sang mga mito, alamat, kagistorya halin sa iban-iban nga kultura sa kalibutan. Pamangkita ako about bisan ano nga diyos, bayani, nilalang, ukon alamat — ukon sabton mo lang \"giya ako\" kag paganan-awon ko ang mga dalan nga nagahulat sa imo."},
  status: {en:"LoreKeeper is active",fil:"LoreKeeper ay aktibo",hil:"LoreKeeper ara kag aktibo"},
  placeholder: {en:"Ask about any myth, deity, or legend...",fil:"Magtanong tungkol sa mito, diyos, o alamat...",hil:"Pamangkita about sa mito, diyos, ukon alamat..."},
  collection: {en:"Collection",fil:"Koleksyon",hil:"Koleksyon"},
  history: {en:"History",fil:"Kasaysayan",hil:"Kasugiran"},
  clear_all: {en:"Clear All",fil:"Burahin Lahat",hil:"Panaguan Lahat"},
  no_saved: {en:"No saved figures yet. Discuss a figure and say \"save this\".",fil:"Wala pang na-save na tao. Mag-usap tungkol sa isang tao at sabihing \"i-save ito\".",hil:"Wala pa gid nga na-save. Mag-istorya about sa isa ka tao kag sabton \"i-save ini\"."},
  no_history: {en:"No conversation history yet.",fil:"Wala pang kasaysayan ng usapan.",hil:"Wala pa gid nga kasugiran sang hambae."},
  chat_cleared: {en:"Chat cleared",fil:"Na-clear na ang usapan",hil:"Na-clear na ang hambae"},
  all_cleared: {en:"All data cleared",fil:"Na-clear na lahat ng datos",hil:"Na-clear na tanan nga datos"},
  saved: {en:"saved to collection",fil:"na-save sa koleksyon",hil:"na-save sa koleksyon"},
  already_saved: {en:"already in collection",fil:"nasa koleksyon na",hil:"ara na sa koleksyon"},
  removed: {en:"Removed from collection",fil:"Tinanggal sa koleksyon",hil:"Gin-tanghal sa koleksyon"},
  restored: {en:"Previous conversation restored",fil:"Na-restore ang nakaraang usapan",hil:"Na-restore ang mga-agi nga hambae"},
  exported: {en:"Chat exported",fil:"Na-export ang usapan",hil:"Na-export ang hambae"},
  guide: {en:"guide me",fil:"giya mo ako",hil:"giya ako"},
  save_this: {en:"save this",fil:"i-save ito",hil:"i-save ini"},
  show_collection: {en:"show my collection",fil:"ipakita ang koleksyon ko",hil:"ipakita ang akon koleksyon"}
};

function t(key){return TR[key]?TR[key][CL]||TR[key].en:key}

// Language detection from input
function detectLang(input){
  const l=input.toLowerCase();
  // Hiligaynon distinctive markers
  const hW=['kinsa','diin','sang','kag','sugilon','sugilanon','buligi','subong','hambalon','ara','ginahimo','tana','bala','ya','daw','man','himo','pangita','pamangkita','malipayon','maayong','abot','bilang','pila','tiil','bukon','wala','huo','indi'];
  // Filipino distinctive markers
  const fW=['sino','saan','nang','ikwento','tulungan','dahil','mayroon','meron','ito','iyan','iyon','nung','kapag','gusto','ngunit','pati','rin','din','kung','pagka','maging','narito','naroon'];
  let hC=0,fC=0;
  hW.forEach(w=>{if(new RegExp('\\b'+w).test(l))hC++});
  fW.forEach(w=>{if(new RegExp('\\b'+w).test(l))fC++});
  if(hC>fC&&hC>=1)return'hil';
  if(fC>=1)return'fil';
  return'en';
}

function setLang(lang){
  CL=lang;
  document.querySelectorAll('#lang_btns .lb').forEach(b=>{b.classList.toggle('act',b.dataset.lang===lang)});
  document.getElementById('ci').placeholder=t('placeholder');
  document.getElementById('status_txt').textContent=t('status');
  document.querySelector('[data-t="col_label"]').textContent=t('collection');
  document.querySelector('[data-t="his_label"]').textContent=t('history');
  document.querySelector('[data-t="clear_all"]').textContent=t('clear_all');
  showChips();
}

// ============================================================
// KNOWLEDGE BASE — includes Philippine mythology
// ============================================================
const KB = [
  // === GREEK ===
  {n:"Zeus",c:"Greek",d:["Sky","Thunder","Law"],r:{en:"King of the Olympian gods, wielder of the thunderbolt. He rules from Mount Olympus, enforcing oaths and cosmic order.",fil:"Hari ng mga Olympian na diyos, tagapag-imbento ng kidlat. Namumuno siya mula sa Bundok Olympus, nagpapanatili ng panata at kosmikong orden.",hil:"Hari sang mga Olympian nga diyos, nagakaptan sang kilat. Siya ang nagadumala sa Bundok Olympus, nagapabantod sang panata kag kosmikong orden."},
    s:["Thunderbolt","Eagle","Oak"],g:"m",rel:["Hera","Poseidon","Athena","Hades"],
    story:{en:"The tale of Zeus begins in darkness. His father Cronus devoured each of his children at birth — for a prophecy foretold his own son would overthrow him. But Rhea wrapped a stone in swaddling clothes and fed it to Cronus, hiding the infant Zeus in a Cretan cave. When Zeus grew, he gave Cronus a draught that forced him to disgorge his siblings. Thus began the Titanomachy: ten years of war. With the Cyclopes as allies, Zeus cast Cronus into Tartarus and claimed the sky as his domain forever.",
      fil:"Nagsimula ang kuwento ni Zeus sa kadiliman. Nilamon ng kanyang amang si Cronus ang bawat anak niya sa kapanganakan — dahil may hula na ang kanyang sariling anak ang magpapabagsak sa kanya. Ngunit binalot ni Rhea ng tela ang isang bato at ipinakain kay Cronus, itinago ang sanggol na si Zeus sa isang yungib sa Crete. Nang lumaki si Zeus, binigyan niya si Cronus ng inumin na nagpabusalsal sa kanyang mga kapatid. Nagsimula ang Titanomachy: sampung taon ng digmaan. Kasama ang mga Cyclopes, itinapon ni Zeus si Cronus sa Tartarus at inangkin ang langit.",
      hil:"Nagsugod ang isturya ni Zeus sa kadulom. Ang iya ama nga si Cronus nagakaon sa tagsa ka anak niya pagkatawo — kay may hula nga ang iya kaugalingon nga anak ang magapatumba sa iya. Pero ginputos ni Rhea ang isa ka bato sang tela kag ginpakaon kay Cronus, gintago ang bata nga si Zeus sa isa ka lungib sa Crete. Sang nagdako si Zeus, ginpainom niya si Cronus sang ilimnon nga nagpapabula sang iya mga utod. Nagsugod ang Titanomachy: napulo ka tuig nga gera. Kaubra sang mga Cyclopes, ginpugsan ni Zeus si Cronus sa Tartarus kag ginkuha ang kalangitan."}},

  {n:"Hera",c:"Greek",d:["Marriage","Women","Sovereignty"],r:{en:"Queen of the Olympian gods, protector of marriage and women. Known for her fierce defense of the marital bond.",fil:"Reyna ng mga Olympian na diyos, tagapangalaga ng kasal at mga babae. Kilala sa kanyang matinding pagtatanggol sa bonding marital.",hil:"Reyna sang mga Olympian nga diyos, tagapangalaga sang kasal kag mga babayi. Kilala sa iya matig-aon nga pagdepensa sa bonding marital."},
    s:["Peacock","Cow","Pomegranate"],g:"f",rel:["Zeus","Hephaestus","Ares"],
    story:{en:"Hera's devotion to marriage is both her strength and her torment. When Zeus first pursued her, she refused — until he transformed into a shivering cuckoo. Taking pity on the bird, she held it close, and Zeus revealed his true form. This marriage became her eternal trial. When Zeus loved Io, Hera turned the girl into a cow and set Argus to guard her. When Zeus loved Leto, Hera forbade any land to give her shelter. But Hera's wrath was the fury of a goddess who understood that the sanctity of marriage was the foundation of civilization.",
      fil:"Ang debosyon ni Hera sa kasal ay parehong lakas at pighati niya. Nang unang ligawan siya ni Zeus, tumanggi siya — hanggang nag-anyong cuckoo na nanginginig si Zeus. Naaawa sa ibon, niyakap niya ito, at nagpakita si Zeus ng tunay niyang anyo. Ang kasal na ito naging walang-hangang pagsubok niya. Nang mahalin ni Zeus si Io, ginawa ni Hera ang dalaga bilang baka at inilagay si Argus na bantay. Ngunit ang galit ni Hera ay ang poot ng isang diyos na naintindihan na ang kabanalan ng kasal ay ang pundasyon ng sibilisasyon.",
      hil:"Ang debosyon ni Hera sa kasal amo ang iya kusog kag man ginadugangan. Sang una nga ginpangasawa siya ni Zeus, nagpangkot siya — hasta nagbalhin si Zeus nga cuckoo nga nangakurog. Naluoy siya sa pispis, ginkaptan niya, kag nagpakita si Zeus sang iya matuod nga porma. Ang kasal nga ini naging walay katapusan nga pagsulit niya. Sang ginhigugma ni Zeus si Io, ginhimo ni Hera ang dalaga nga baka kag ginpabantay ni Argus. Pero ang kasuko ni Hera amo ang kaakig sang isa ka diyos nga nakaintindi nga ang kasantusahan sang kasal amo ang pundasyon sang sibilisasyon."}},

  {n:"Poseidon",c:"Greek",d:["Sea","Earthquakes","Horses"],r:{en:"God of the sea and earthquakes, creator of the first horse. His moods govern the fate of every sailor.",fil:"Diyos ng dagat at lindol, lumikha ng unang kabayo. Ang kanyang mga emosyon ang nagdidikta sa kapalaran ng bawat mandaragat.",hil:"Diyos sang dagat kag linog, naghimu sang una nga kabayo. Ang iya mga emosyon ang nagadikta sa kapalaran sang tagsa ka mandaragat."},
    s:["Trident","Horse","Dolphin"],g:"m",rel:["Zeus","Hades","Amphitrite"],story:{en:"When the three brothers drew lots for the cosmos, Poseidon won the sea. He contested Athens with Athena, striking the Acropolis to produce a salt spring. Athena offered the olive tree, and the people chose her gift. He built the walls of Troy alongside Apollo, and when King Laomedon refused payment, Poseidon sent a sea monster. He cursed Odysseus for blinding his son Polyphemus — the sea gives and the sea takes, and neither gift comes cheap.",
      fil:"Nang magbunot ng lots ang tatlong kapatid para sa cosmos, nakuha ni Poseidon ang dagat. Naglaban siya kay Athena para sa Athens. Inalok ni Athena ang puno ng olibo, at pinili ng tao ang kanyang regalo. Itinayo niya ang mga pader ng Troy kasama ni Apollo. Nang tumanggi si Haring Laomedon magbayad, nagpadala si Poseidon ng sea monster. Sinalanta niya si Odysseus dahil binulag niya ang anak niyang si Polyphemus — ang dagat ay nagbibigay at nag-aalis, at walang libre.",
      hil:"Sang nagbunot sang lots ang tatlo ka utod para sa kalibutan, nakuha ni Poseidon ang dagat. Nag-away siya kay Athena para sa Athens. Gintanyag ni Athena ang kahoy nga olibo, kag napilian sang mga tao ang iya regalo. Ginhimo niya ang mga pader sang Troy kaubra ni Apollo. Sang nagpangkot si Haring Laomedon magbayad, nagpadala si Poseidon sang sea monster. Gintunggan niya si Odysseus kay ginbuta niya ang iya anak nga si Polyphemus — ang dagat nagahatag kag nagakwa, kag wala gid libre."}},

  {n:"Athena",c:"Greek",d:["Wisdom","Strategic War","Crafts"],r:{en:"Goddess of wisdom and strategic warfare, born from Zeus's head fully armed. Patron of Athens, protector of heroes.",fil:"Diyosa ng karunungan at estratehikong digmaan, ipinanganak mula sa ulo ni Zeus na nakabuo. Patron ng Athens, tagapangalaga ng mga bayani.",hil:"Diyosa sang kaalam kag estratehikong gera, natawo halin sa ulo ni Zeus nga armado. Patron sang Athens, tagapangalaga sang mga bayani."},
    s:["Owl","Olive Tree","Aegis"],g:"f",rel:["Zeus","Ares","Odysseus"],story:{en:"Athena's birth shook Olympus. Zeus had swallowed her mother Metis after a prophecy. But wisdom grew inside him until a headache drove him to command Hephaestus to split his skull. From the cleft leaped Athena — fully grown, clad in golden armor. She guided Perseus to slay Medusa, taught Odysseus cunning, and wove the tapestry of the gods' triumph. When the mortal Arachne challenged her to a weaving contest, Athena destroyed the girl's blasphemous tapestry and transformed her into the first spider.",
      fil:"Yuminig ang Olympus sa kapanganakan ni Athena. Nilamon ni Zeus ang kanyang inang si Metis. Ngunit lumaki ang karunungan sa loob niya hanggang sa sumakit ang kanyang ulo at ipinag-utos niya kay Hephaestus na hiwain ang kanyang bungo. Mula sa hiwa ay lumundag si Athena — ganap na adulto, suot ang gintong baluti. Ginabayan niya si Perseus para patayin si Medusa, itinuro kay Odysseus ang katalinuhan. Nang hamunin siya ni Arachne sa paghabi, winasak ni Athena ang tapestry at ginawa siya sa unang gagamba.",
      hil:"Nanginog ang Olympus sa pagkatawo ni Athena. Ginkaon ni Zeus ang iya ina nga si Metis. Pero nagdako ang kaalam sulod sa iya hasta nasakit ang iya ulo kag ginpagutos niya kay Hephaestus nga bukon ang iya bungo. Halin sa bini lumundag si Athena — todo dako, nakasul-ot sang bulawan nga baluti. Gingiya niya si Perseus para pamatay si Medusa, gintudluan si Odysseus sang katalinuhan. Sang hinabalos siya ni Arachne sa paghaboe, ginpanas ni Athena ang tapestry kag ginhimo siya nga una nga lawa."}},

  {n:"Apollo",c:"Greek",d:["Sun","Music","Prophecy","Healing"],r:{en:"God of the sun, music, poetry, and prophecy. Patron of the Oracle at Delphi.",fil:"Diyos ng araw, musika, tula, at propesiya. Patron ng Oracle sa Delphi.",hil:"Diyos sang adlaw, musika, balak, kag propesiya. Patron sang Oracle sa Delphi."},
    s:["Lyre","Bow","Laurel Wreath"],g:"m",rel:["Artemis","Zeus","Dionysus"],story:{en:"Apollo was born on Delos beneath a palm tree. Only four days old, he demanded a bow and set out to find a place for his oracle. He chose Delphi, but a great serpent, the Python, guarded the spring. Young Apollo slew it with his first arrows. He loved the nymph Daphne, and when she fled, he chased her until she transformed into a laurel tree — ever after his sacred plant, a crown of leaves that cannot love back.",
      fil:"Ipinanganak si Apollo sa Delos sa ilalim ng palmera. Apat na araw pa lang, humingi siya ng pana at naghanap ng lugar para sa kanyang oracle. Pumili siya ng Delphi, ngunit binabantayan ng Python. Binaril ni Apollo ito. Minahal niya ang nymph na si Daphne, at nang tumakas siya, hinabol niya hanggang sa maging palmera siya — mula noon ay naging sagradong halamanan ito niya.",
      hil:"Natawo si Apollo sa Delos sa idalom sang palmera. Apat ka adlaw pa lang, nagpangayo siya sang pana kag nagpangita sang lugar para sa iya oracle. Napilian niya ang Delphi, pero ginabantayan sang Python. Ginpusil ni Apollo ini. Ginhigugma niya ang nymph nga si Daphne, kag sang nagpalagyo siya, ginalagyo niya hasta nagbalhin siya nga laurel nga kahoy — halin sadto naging sagradong tanom niya."}},

  {n:"Artemis",c:"Greek",d:["Hunt","Moon","Wilderness","Chastity"],r:{en:"Goddess of the hunt and the moon. Protector of wild things and young women.",fil:"Diyosa ng pangangaso at buwan. Tagapangalaga ng mga ligaw na bagay at mga batang babae.",hil:"Diyosa sang pangangaso kag bulan. Tagapangalaga sang mga layas nga butang kag mga bata nga babayi."},
    s:["Bow","Deer","Crescent Moon"],g:"f",rel:["Apollo","Zeus","Leto"],story:{en:"Artemis was born first and helped deliver her twin Apollo. She asked Zeus for six wishes: a bow, a chorus of nymphs, a short tunic for running, all the mountains, a single city, and eternal chastity. She roams wild places where no man rules. Actaeon, who accidentally saw her bathing, she transformed into a stag — and his own hounds tore him apart.",
      fil:"Ipinanganak muna si Artemis at tinulungan niyang ipanganak ang kanyang kambal na si Apollo. Humingi siya kay Zeus ng anim na kahilingan: pana, koro ng mga nymph, maikling damit, lahat ng bundok, isang lungsod, at walang-hangang kalinisang-puri. Siya ay gumagala sa mga ligaw na lugar. Si Actaeon, na aksidenteng nakita siyang naliligo, ay ginawa niyang usa — at pinatay siya ng sarili niyang aso.",
      hil:"Natawo anay si Artemis kag ginbuligan niya ang pagkatawo sang iya kambal nga si Apollo. Nagpangayo siya kay Zeus sang anom ka pangayo: pana, koro sang mga nymph, mubu nga bado para magdalagan, tanan nga bundok, isa ka syudad, kag walay katapusan nga kalinisngan. Siya nagalibot sa mga layas nga lugar. Si Actaeon, nga di-palagyo nakita siya nagabaligo, ginhimo niya nga usa — kag ginpatay siya sang iya kaugalingon nga aso."}},

  {n:"Aphrodite",c:"Greek",d:["Love","Beauty","Desire"],r:{en:"Goddess of love and beauty, born from sea foam. Her power over desire affects gods and mortals alike.",fil:"Diyosa ng pag-ibig at kagandahan, ipinanganak mula sa sea foam. Ang kapangyarihan niya sa pagnanasa ay nakakaapekto sa mga diyos at tao.",hil:"Diyosa sang gugma kag katahom, natawo halin sa sea foam. Ang iya gahom sa pangita nakakaapekto sa mga diyos kag mga tao."},
    s:["Dove","Rose","Myrtle"],g:"f",rel:["Hephaestus","Ares","Eros"],story:{en:"When Cronus cast Uranus's remains into the ocean, the water churned white, and from this foam Aphrodite rose — the most beautiful being. The gods married her to Hephaestus, but she loved Ares. Their affair was exposed when Hephaestus crafted an invisible net that trapped them in bed together. Love, she teaches, is the most dangerous force in the universe.",
      fil:"Nang itapon ni Cronus ang labi ni Uranus sa karagatan, ang tubig ay umapaw, at mula sa foam na ito ay lumitaw si Aphrodite — ang pinakamagandang nilalang. Inasawa siya kay Hephaestus, ngunit minahal niya si Ares. Nalantad ang kanilang relasyon nang gumawa si Hephaestus ng di-nakikitang net. Itinuturo niya na ang pag-ibig ang pinakamapanganib na puwersa sa sansinukob.",
      hil:"Sang ginpugsan ni Cronus ang labi ni Uranus sa dagat, ang tubig nagapulo, kag halin sa foam nga ini naglitaw si Aphrodite — ang pinakamatahom nga nilalang. Ginkasal siya kay Hephaestus, pero ginhigugma niya si Ares. Naglawig ang ila relasyon sang naghimu si Hephaestus sang di-makita nga net. Gintudluan niya nga ang gugma amo ang pinakamakatalang gahom sa kalibutan."}},

  {n:"Hades",c:"Greek",d:["Underworld","Death","Wealth"],r:{en:"God of the underworld, ruler of the dead. Not evil — he ensures cosmic boundaries are respected.",fil:"Diyos ng underworld, pinuno ng mga patay. Hindi masama — tiyakin niya na nirerespeto ang mga kosmikong hangganan.",hil:"Diyos sang underworld, manunudlo sang mga minatay. Indi malain — siguraduhon niya nga ginatipon ang mga kosmikong limitasyon."},
    s:["Cerberus","Helm of Darkness","Scepter"],g:"m",rel:["Zeus","Poseidon","Persephone"],story:{en:"Hades drew the worst lot — the underworld. He sits beside Persephone and judges the dead. The dead must cross the Styx, paying Charon with a coin. Cerberus guards the gate. When Orpheus came to reclaim Eurydice, Hades was moved to tears — the only time the lord of death showed mercy. But Orpheus looked back, and the condition was broken.",
      fil:"Nakuha ni Hades ang pinakamalang lot — ang underworld. Nakasalaming siya kay Persephone at naghuhat sa mga patay. Ang mga patay ay kailangang tumawid sa Styx, nagbabayad kay Charon ng barya. Si Cerberus ang bantay. Nang pumunta si Orpheus para bawiin si Eurydice, naiyak si Hades — ang tanging pagkakataon na nagpakita ng awa ang panginoon ng kamatayan. Ngunit lumingon si Orpheus, at nasira ang kondisyon.",
      hil:"Nakuha ni Hades ang pinakamalain nga lot — ang underworld. Nagaupod siya kay Persephone kag nagahukom sang mga minatay. Ang mga minatay kinahanglan magtabok sa Styx, nagabayaran si Charon sang kwarta. Si Cerberus ang bantay. Sang nagkadto si Orpheus para ibalik si Eurydice, naghueak si Hades — ang isa lang ka beses nga nagpakita sang kaluoy ang agalon sang kamatayan. Pero nagliso si Orpheus, kag nabungkag ang kasuguan."}},

  // === NORSE ===
  {n:"Odin",c:"Norse",d:["Wisdom","War","Poetry","Death"],r:{en:"All-Father, chief of the Aesir. Sacrificed his eye for wisdom and hung himself on Yggdrasil for nine nights to learn the runes.",fil:"All-Father, pinuno ng Aesir. Inihandog niya ang kanyang mata para sa karunungan at nagbigti siya sa Yggdrasil sa siyam na gabi para matuto ng mga rune.",hil:"All-Father, manunudlo sang Aesir. Ginhalad niya ang iya mata para sa kaalam kag nagbigti siya sa Yggdrasil sang siyam ka gab-i para makatunod sang mga rune."},
    s:["Gungnir","Ravens","Sleipnir"],g:"m",rel:["Thor","Loki","Frigg","Baldur"],story:{en:"Odin gave his right eye to Mimir to drink from the well of wisdom. He hung himself from Yggdrasil for nine nights with a spear in his side, sacrificing himself to himself, until the runes revealed themselves. He stole the Mead of Poetry from the giants. His ravens Huginn (Thought) and Muninn (Memory) fly out each dawn. Yet for all his wisdom, he cannot prevent Ragnarok — only delay it.",
      fil:"Ibinigay ni Odin ang kanyang kanang mata kay Mimir upang uminom mula sa balon ng karunungan. Nagbigti siya sa Yggdrasil nang siyam na gabi na may sibat sa kanyang tagiliran, hanggang sa magpakita ang mga rune. Ninakaw niya ang Mead of Poetry mula sa mga giant. Ang kanyang mga uwak na si Huginn at Muninn ay lumilipad araw-araw. Ngunit sa kabila ng kanyang karunungan, hindi niya mapigilan ang Ragnarok.",
      hil:"Ginhatag ni Odin ang iya too nga mata kay Mimir agod uminom halin sa bubon sang kaalam. Nagbigti siya sa Yggdrasil sang siyam ka gab-i nga may sibat sa iya kilid, hasta nagpakita ang mga rune. Ginkawat niya ang Mead of Poetry halin sa mga giant. Ang iya mga uwak nga si Huginn kag Muninn nagalupad kada adlaw. Pero bisan pa sang iya kaalam, indi niya mapunggan ang Ragnarok."}},

  {n:"Thor",c:"Norse",d:["Thunder","Storms","Strength","Protection"],r:{en:"God of thunder, protector of Midgard and mankind. Wields Mjolnir, the hammer that always returns.",fil:"Diyos ng kulog, tagapangalaga ng Midgard at sangkatauhan. Hawak niya ang Mjolnir, ang martilyong palaging bumabalik.",hil:"Diyos sang dalugdog, tagapangalaga sang Midgard kag sang katawhan. Gakaptan niya ang Mjolnir, ang martilyo nga permi nagapabalik."},
    s:["Mjolnir","Goats","Megingjord"],g:"m",rel:["Odin","Loki","Sif","Jormungandr"],story:{en:"When the giant Thrym stole Mjolnir and demanded Freya, Thor disguised himself in a wedding dress, took Loki as bridesmaid, and walked into the giant's hall. When Mjolnir was placed in the bride's hands, Thor threw off the veil and slaughtered every giant. At Ragnarok, Thor and the World Serpent Jormungandr will meet. Thor will kill the serpent, then walk nine steps before falling dead from its venom.",
      fil:"Nang nakawin ni Thrym si Mjolnir at hiningi si Freya, nag-disguise si Thor sa kasuotang kasal, kinuha si Loki bilang bridesmaid. Nang ilagay si Mjolnir sa kamay ng nobya, tinanggal ni Thor ang belo at pinatay ang lahat ng giant. Sa Ragnarok, magkikita si Thor at ang World Serpent na si Jormungandr. Patayin niya ang ahas, ngunit mamamatay din siya sa lason nito pagkatapos ng siyam na hakbang.",
      hil:"Sang ginkawat ni Thrym si Mjolnir kag nagpangayo kay Freya, nag-disguise si Thor sa bado sang kasal, ginkuha ni Loki nga bridesmaid. Sang ginputang si Mjolnir sa kamot sang nobya, ginkuha ni Thor ang belo kag ginpatay tanan nga giant. Sa Ragnarok, magakita si Thor kag ang World Serpent nga si Jormungandr. Imapatay niya ang bitin, pero mapatay man siya sa iya hilom pagkatapos sang siyam ka lakang."}},

  {n:"Loki",c:"Norse",d:["Mischief","Trickery","Fire","Chaos"],r:{en:"Trickster god, shapeshifter and chaos-bringer. Father of monsters, blood-brother of Odin.",fil:"Diyos ng kalokohan, shapeshifter at tagadala ng kaguluhan. Ama ng mga halimaw, kapatid sa dugo ni Odin.",hil:"Diyos sang kalibangan, shapeshifter kag tagadala sang kagubot. Amay sang mga halimaw, utod sa duga ni Odin."},
    s:["Serpent","Knot","Fly"],g:"m",rel:["Odin","Thor","Fenrir","Hel"],story:{en:"Loki makes stories happen — and ends them. He shapeshifts into a fly, a salmon, a mare — he even gave birth to Odin's horse Sleipnir. He cut off Sif's golden hair and replaced it with dwarf-forged gold. He arranged the death of Baldur with a spear of mistletoe. For this, the gods bound him to rocks with his son's entrails, and a serpent drips venom onto his face. At Ragnarok, he will break free and lead the giants against the gods.",
      fil:"Si Loki ang nagpapagalaw sa mga kuwento — at nagtatapos sa kanila. Nagbabago siya ng anyo — maging langaw, salmon, kabayo — ipinanganak pa niya ang kabayo ni Odin na si Sleipnir. Ginupit niya ang gintong buhok ni Sif at pinalitan ng gawa ng dwarf. Siya ang nag-ayos ng kamatayan ni Baldur sa sibat ng mistletoe. Dahil dito, tinali siya ng mga diyos sa bato at may ahas na nagtutulo ng lason sa kanyang mukha. Sa Ragnarok, makakawala siya at pamumunuan ang mga giant laban sa mga diyos.",
      hil:"Si Loki ang nagapakilos sang mga isturya — kag nagapatapos sa ila. nagabalhin siya sang porma — bilang langaw, salmon, kabayo — natawo pa niya ang kabayo ni Odin nga si Sleipnir. Ginputol niya ang bulawan nga buhok ni Sif kag ginsingitan sang ginhimo sang dwarf. Siya ang nag-ayos sang kamatayon ni Baldur sa sibat sang mistletoe. Tungod sini, gintali siya sang mga diyos sa bato kag may bitin nga nagatulo sang hilom sa iya nawong. Sa Ragnarok, makalagyo siya kag manunudlo sang mga giant batok sa mga diyos."}},

  {n:"Freya",c:"Norse",d:["Love","Beauty","War","Magic"],r:{en:"Goddess of love, beauty, and war. Leader of the Valkyries, master of seidr magic. Claims half the battle-slain.",fil:"Diyosa ng pag-ibig, kagandahan, at digmaan. Pinuno ng Valkyries, dalubhasa ng seidr magic. Kinukuha ang kalahati ng mga patay sa digmaan.",hil:"Diyosa sang gugma, katahom, kag gera. Manunudlo sang Valkyries, eksperto sang seidr magic. Ginakwa ang katunga sang mga minatay sa gera."},
    s:["Brisingamen","Falcon Cloak","Cats"],g:"f",rel:["Freyr","Odin","Odr"],story:{en:"Freya's necklace Brisingamen was bought by spending a night with each of the four dwarves who forged it. When Odin ordered Loki to steal it, Freya confronted him, and Odin demanded she stir eternal war between two kings. She rides a chariot pulled by cats and owns a falcon cloak. Half the battle-slain come to her hall Sessrumnir.",
      fil:"Ang kuwintas ni Freya na Brisingamen ay binili sa pamamagitan ng paggugol ng isang gabi sa bawat isa sa apat na dwarf na gumawa nito. Nang utusan ni Odin si Loki na nakawin ito, humarap si Freya sa kanya, at iniutos ni Odin na magtulak siya ng walang-hanggang digmaan. Sumasakay siya sa karuwaheng hila ng pusa at may falcon cloak. Ang kalahati ng mga patay sa digmaan ay napupunta sa kanyang bulwagan na Sessrumnir.",
      hil:"Ang kuwintas ni Freya nga Brisingamen ginkalipot paagi sa paggugol sang isa ka gab-i sa tagsa sa apat ka dwarf nga naghimu sini. Sang ginpagutos ni Odin si Loki nga kawaton ini, nag-atubang si Freya sa iya, kag ginpagutos ni Odin nga magtulod siya sang walay katapusan nga gera. Nagasakay siya sa karuwaheng gina-guyod sang pusa kag may falcon cloak. Ang katunga sang mga minatay sa gera nagakadto sa iya bulwagan nga Sessrumnir."}},

  // === EGYPTIAN ===
  {n:"Ra",c:"Egyptian",d:["Sun","Creation","Kingship"],r:{en:"Sun god, king of the Egyptian pantheon. Sails across the sky by day and battles Apophis by night.",fil:"Diyos ng araw, hari ng Egyptian pantheon. Naglalayag sa kalangitan sa araw at nakikipaglaban kay Apophis sa gabi.",hil:"Diyos sang adlaw, hari sang Egyptian pantheon. Nagalayag sa kalangitan sa adlaw kag nagakigera kay Apophis sa gab-i."},
    s:["Sun Disk","Falcon","Obelisk"],g:"m",rel:["Osiris","Set","Horus","Thoth"],story:{en:"In the beginning, Ra created himself from Nun — the primordial waters. Each morning he sails across the sky, and each evening descends into the Duat to battle the serpent Apophis. When mortals mocked him, he sent his Eye — Sekhmet — who slaughtered so many that Ra dyed beer red like blood. Sekhmet drank it, fell asleep, and awoke as the gentler Hathor.",
      fil:"Sa simula, nilikha ni Ra ang kanyang sarili mula sa Nun — ang primal na tubig. Araw-araw siyang naglalayag sa kalangitan, at gabi-gabi bumababa sa Duat para labanan ang ahas na si Apophis. Nang libakin siya ng mga tao, ipinadala niya ang kanyang Mata — si Sekhmet — na pumatay ng marami. Nagpinta si Ra ng serbesa na pula tulad ng dugo. Uminom si Sekhmet, natulog, at nagising bilang mas mahinahong si Hathor.",
      hil:"Sa una, ginhimo ni Ra ang iya kaugalingon halin sa Nun — ang primal nga tubig. Kada adlaw siya nagalayag sa kalangitan, kag kada gab-i nagapasulod sa Duat para maglaban sang bitin nga si Apophis. Sang ginlibak siya sang mga tao, ginpadala niya ang iya Mata — si Sekhmet — nga nagpatay sang madamo. Nagpinta si Ra sang serbesa nga pula pareho sang duga. Naginom si Sekhmet, natulog, kag nagmata bilang mas malumo nga si Hathor."}},

  {n:"Osiris",c:"Egyptian",d:["Underworld","Resurrection","Fertility"],r:{en:"God of the dead and resurrection. Murdered by Set, reassembled by Isis. He judges the dead in the Hall of Truth.",fil:"Diyos ng mga patay at muling pagkabuhay. Pinatay ni Set, muling pinagsama ni Isis. Naghhukom siya sa mga patay sa Hall of Truth.",hil:"Diyos sang mga minatay kag pagkabuhay liwat. Ginpapatay ni Set, gintipon liwat ni Isis. Nagahukom siya sang mga minatay sa Hall of Truth."},
    s:["Crook and Flail","Djed Pillar"],g:"m",rel:["Isis","Set","Horus","Nephthys"],story:{en:"Set crafted a magnificent chest fitted perfectly to Osiris. At a banquet, he offered it to whoever it fit. When Osiris lay inside, Set sealed it and threw it into the Nile. Isis found it, but Set dismembered Osiris into fourteen pieces. Isis found every piece except one, reassembled him, and conceived Horus. Osiris descended to the Duat and became its king — the judge before whom every soul must stand.",
      fil:"Gumawa si Set ng isang magandang kaban na akma kay Osiris. Sa isang bangkete, inalok niya ito sa sinumang akma. Nang mahiga si Osiris, sinarhan ito ni Set at itinapon sa Nile. Nakita ito ni Isis, ngunit pinutol-putol ni Set si Osiris sa labing-apat na piraso. Nakita ni Isis ang bawat piraso maliban sa isa, muling pinagsama siya, at naglihi kay Horus. Bumaba si Osiris sa Duat at naging hari nito — ang hukom na dapat harapin ng bawat kaluluwa.",
      hil:"Naghimo si Set sang isa ka matahom nga kaban nga angay kay Osiris. Sa isa ka bangkete, gintanyag niya ini sa bisan sino nga angay. Sang nagligto si Osiris, ginsarhan ini ni Set kag ginpugsan sa Nile. Nakita ini ni Isis, pero ginputol-putol ni Set si Osiris sang katorse ka piraso. Nakita ni Isis ang tagsa ka piraso luwas sa isa, gintipon liwat siya, kag nagbuntis kay Horus. Nagpanaog si Osiris sa Duat kag naging hari sini — ang hukom nga angay atubangon sang tagsa ka kalag."}},

  {n:"Isis",c:"Egyptian",d:["Magic","Motherhood","Healing"],r:{en:"Goddess of magic and motherhood, the most powerful magician among the gods.",fil:"Diyosa ng mahika at pagiging ina, ang pinakamakapangyarihang salamangkero sa mga diyos.",hil:"Diyosa sang mahika kag pagiging ina, ang pinakamakusog nga salamangkero sa mga diyos."},
    s:["Throne","Ankh","Tyet Knot"],g:"f",rel:["Osiris","Horus","Set"],story:{en:"Isis created a serpent that bit Ra, and when the sun god lay dying, she offered to heal him — but the cure required his true secret name. In agony, Ra yielded, and Isis gained mastery over the most powerful being. When Set murdered Osiris, she found every piece and used magic to restore him long enough to conceive Horus. Then she fled to the marshes, raising Horus alone while Set's assassins searched.",
      fil:"Gumawa si Isis ng ahas na kumagat kay Ra, at nang moribundus na si Ra, inalok niyang pagalingin siya — ngunit kailangan ang tunay niyang lihim na pangalan. Sa kirot, sumuko si Ra, at nakakuha si Isis ng kapangyarihan sa pinakamakapangyarihang nilalang. Nang patayin ni Set si Osiris, nakita niya ang bawat piraso at ginamit ang mahika para ibalik siya nang sapat upang maglihi kay Horus. Pagkatapos ay tumakas siya sa mga latian, pinalaki si Horus nang mag-isa.",
      hil:"Naghimo si Isis sang bitin nga nagakagat kay Ra, kag sang moribundus na si Ra, gintanyag niya nga pamuligon siya — pero kinahanglan ang iya matuod nga tago nga ngalan. Sa kasakit, nagpangkot si Ra, kag nakakuha si Isis sang gahom sa pinakamakusog nga nilalang. Sang ginpatay ni Set si Osiris, nakita niya ang tagsa ka piraso kag nagamit ang mahika para ibalik siya sing igo agod magbuntis kay Horus. Pagkatapos nagpalagyo siya sa mga latian, ginpadako si Horus nagaisa."}},

  // === JAPANESE ===
  {n:"Amaterasu",c:"Japanese",d:["Sun","Light","Imperial Line"],r:{en:"Sun goddess, ancestor of the Japanese imperial line. Emerged from a cave to restore light to the world.",fil:"Diyosa ng araw, ninuno ng Japanese imperial line. Lumabas mula sa yungib upang ibalik ang liwanag sa mundo.",hil:"Diyosa sang adlaw, apoyan sang Japanese imperial line. Naglitaw halin sa lungib agod ibalik ang kasanag sa kalibutan."},
    s:["Sacred Mirror","Magatama","Rooster"],g:"f",rel:["Susanoo","Tsukuyomi","Izanagi"],story:{en:"When Susanoo destroyed her rice fields and defiled her weaving hall, Amaterasu retreated into the Heavenly Rock Cave and sealed it. The world fell into darkness. Eight hundred gods gathered and tried everything. Finally, Ame-no-Uzume performed a bawdy dance that made all the gods roar with laughter. Curious, Amaterasu opened the cave — and saw her reflection in a mirror. When she stepped out, light flooded the world again.",
      fil:"Nang sirain ni Susanoo ang kanyang mga palayan at lapastanganin ang kanyang weaving hall, umurong si Amaterasu sa Heavenly Rock Cave at isinarado ito. Natigilan ang mundo sa kadiliman. Walong daang diyos ang nagtipon at sumubok ng lahat. Sa huli, nagsayaw si Ame-no-Uzume na nagpatawa sa lahat ng diyos. Naging usyoso si Amaterasu, binuksan ang yungib — at nakita ang kanyang repleksyon sa salamin. Nang lumabas siya, bumaha ang liwanag sa mundo.",
      hil:"Sang ginpierde ni Susanoo ang iya mga uma kag gindulaan ang iya weaving hall, nag-urong si Amaterasu sa Heavenly Rock Cave kag ginsarhan. Natiglan ang kalibutan sa kadulom. Walo ka gatos nga diyos ang nagtipon kag nagpruba sang tanan. Sa katapusan, nagsayaw si Ame-no-Uzume nga nagpatawa sa tanan nga diyos. Nag-usisa si Amaterasu, ginkabkos ang lungib — kag nakita ang iya repleksyon sa salaming. Sang naglitaw siya, nag-abono ang kasanag sa kalibutan."}},

  {n:"Susanoo",c:"Japanese",d:["Storms","Sea","Heroism"],r:{en:"Storm god, slayer of the eight-headed serpent Yamata no Orochi. Proved his heroism on earth.",fil:"Diyos ng bagyo, pumatay ng walong-ulong ahas na Yamata no Orochi. Pinatunayan niya ang kanyang kagitingan sa lupa.",hil:"Diyos sang bagyo, nagpatay sang walo-ulo nga bitin nga Yamata no Orochi. Ginpakita niya ang iya kaisog sa kalibutan."},
    s:["Sword (Kusanagi)","Storm Clouds"],g:"m",rel:["Amaterasu","Tsukuyomi"],story:{en:"Banished from heaven, Susanoo descended to Izumo. He found an old couple weeping: each year the eight-headed serpent Yamata no Orochi devoured one of their daughters, and only Kushinada-hime remained. Susanoo set his trap: eight vats of sake. The serpent drank, fell asleep, and Susanoo hacked it to pieces. In its tail, he found Kusanagi-no-Tsurugi — which became one of the three Imperial Regalia of Japan.",
      fil:"Itinaboy mula sa langit, bumaba si Susanoo sa Izumo. Nakita niya ang isang matandang mag-asawa na umiiyak: taun-taon kinakain ng walong-ulong ahas na Yamata no Orochi ang isa sa kanilang mga anak, at si Kushinada-hime na lang ang natira. Nagtanim si Susanoo: walong banga ng sake. Uminom ang ahas, natulog, at pinutol-putol ni Susanoo. Sa buntot nito, nakita niya ang Kusanagi-no-Tsurugi — naging isa sa tatlong Imperial Regalia ng Japan.",
      hil:"Gintabog halin sa langit, nagpanaog si Susanoo sa Izumo. Nakita niya ang isa ka tigulang nga mag-asawa nga nagahueak: kada tuig ginkaon sang walo-ulo nga bitin nga Yamata no Orochi ang isa sa ila mga anak, kag si Kushinada-hime na lang ang nabutlan. Nagtanom si Susanoo: walo ka banga sang sake. Naginom ang bitin, natulog, kag ginputol-putol ni Susanoo. Sa iya ikog, nakita niya ang Kusanagi-no-Tsurugi — naging isa sa tatlo ka Imperial Regalia sang Japan."}},

  // === HINDU ===
  {n:"Vishnu",c:"Hindu",d:["Preservation","Order","Compassion"],r:{en:"Preserver god of the Trimurti. Descends as avatars whenever dharma declines and evil rises.",fil:"Diyos na tagapangalaga ng Trimurti. Nagbababa bilang avatar kapag humina ang dharma at tumaas ang kasamaan.",hil:"Diyos nga tagapangalaga sang Trimurti. Nagapanaug bilang avatar kon magapuya ang dharma kag magataas ang kalainan."},
    s:["Sudarshana Chakra","Shankha","Gada"],g:"m",rel:["Lakshmi","Shiva","Brahma","Krishna"],story:{en:"When the demon Hiranyakashipu gained immunity from gods, humans, and beasts, Vishnu emerged as Narasimha — neither man nor beast — and destroyed him with his claws. As Rama, he defeated Ravana. As Krishna, he spoke the Bhagavad Gita. Whenever dharma wavers, Vishnu descends — not to judge, but to restore balance.",
      fil:"Nang makakuha ng kaligtasan ang demon na si Hiranyakashipu mula sa mga diyos, tao, at hayop, lumitaw si Vishnu bilang Narasimha — hindi tao ni hayop — at sinira siya ng kanyang mga kuko. Bilang Rama, tinalo niya si Ravana. Bilang Krishna, binigkas niya ang Bhagavad Gita. Kapag nanghihina ang dharma, bumababa si Vishnu — hindi upang maghatol, kundi upang ibalik ang balanse.",
      hil:"Sang nakakuha sang kaligtasan ang demon nga si Hiranyakashipu halin sa mga diyos, tao, kag sapat, naglitaw si Vishnu bilang Narasimha — indi tamo ukon sapat — kag ginpanas siya sang iya mga kuko. Bilang Rama, gindaog niya si Ravana. Bilang Krishna, ginhambal niya ang Bhagavad Gita. Kon magapuya ang dharma, nagapanaog si Vishnu — indi agod maghukom, kundi agod ibalik ang balanse."}},

  {n:"Shiva",c:"Hindu",d:["Destruction","Transformation","Meditation","Dance"],r:{en:"Destroyer/Transformer of the Trimurti. Lord of the cosmic dance (Nataraja), patron of ascetics.",fil:"Tagapwas/Tagabago ng Trimurti. Panginoon ng kosmikong sayaw (Nataraja), patron ng mga asetiko.",hil:"Tagapwas/Tagabago sang Trimurti. Agalon sang kosmikong sayaw (Nataraja), patron sang mga asetiko."},
    s:["Trishula","Damru","Nandi","Third Eye"],g:"m",rel:["Parvati","Ganesha","Vishnu"],story:{en:"Shiva's dance of destruction — the Tandava — creates as much as it destroys. When Kama shot an arrow to wake him from meditation, Shiva's third eye incinerated him. He drank the halahala poison from the churning of the ocean, holding it in his throat until it turned blue — Nilakantha, the Blue-Throated One. Destruction, he teaches, is not the opposite of creation — it is its prerequisite.",
      fil:"Ang sayaw ng pagwas ni Shiva — ang Tandava — ay lumilikha ng kasing dami ng kanyang winawasak. Nang pana ni Kama para gisingin siya, sinunog siya ng third eye ni Shiva. Uminom siya ng lason na halahala mula sa pagkalat ng karagatan, hinawakan ito sa kanyang lalamunan hanggang sa bumaluktot ito — Nilakantha, ang Bughaw ang Lalamunan. Itinuturo niya na ang pagkawasak ay hindi kabaligtaran ng paglikha — ito ay kinakailangan.",
      hil:"Ang sayaw sang pagpanas ni Shiva — ang Tandava — nagahimo sing pareho sang iya gnapaas. Sang pana ni Kama para pagmatahon siya, ginsunog siya sang third eye ni Shiva. Naginom siya sang hilom nga halahala halin sa pagkalat sang dagat, ginkaptan ini sa iya li-og hasta nagbaluktot ini — Nilakantha, ang Azul nga Li-og. Gintudluan niya nga ang pagpanas indi kaiban sang paghimo — ini ang iya kinahanglan."}},

  {n:"Ganesha",c:"Hindu",d:["Obstacles","Wisdom","New Beginnings"],r:{en:"Elephant-headed remover of obstacles. Invoked at the start of every endeavor.",fil:"Elephant-ulo na tagapag-alis ng mga balakid. Inaanyayahan sa simula ng bawat pagtatangka.",hil:"Elephant-ulo nga tagapagtanghal sang mga balakid. Ginaanyayahan sa una sang tagsa ka pagtilimo."},
    s:["Modak","Axe","Mouse"],g:"m",rel:["Shiva","Parvati","Kartikeya"],story:{en:"Parvati created a boy from turmeric paste to guard her door. Shiva, finding a stranger, cut off his head. Parvati's grief threatened the universe. Shiva ordered his ganas to bring the head of the first creature facing north — an elephant. Ganesha lost a tusk writing the Mahabharata as Vyasa dictated it. The mouse he rides represents the ego that must be controlled.",
      fil:"Gumawa si Parvati ng batang lalaki mula sa turmeric paste para bantayan ang kanyang pinto. Sinundo ni Shiva, putulin ang ulo ng bata. Ang kalungkutan ni Parvati ay nagbanta sa sansinukob. Iniutos ni Shiva na dalhin ang ulo ng unang nilalang na nakaharap sa hilaga — isang elepante. Nawalan ng ngipin si Ganesha habang sumusulat ng Mahabharata. Ang daga na kanyang sinasakayan ay kumakatawan sa ego na dapat kontrolin.",
      hil:"Naghimo si Parvati sang bata nga lalaki halin sa turmeric paste agod magbantay sang iya pultahan. Nakita ni Shiva ang wala sing kilala, ginputol ang ulo sang bata. Ang kasakit ni Parvati nagpangalas sa kalibutan. Ginpagutos ni Shiva nga dalhon ang ulo sang una nga nilalang nga nakaharap sa amihan — isa ka elepante. Nawalan sang ngipon si Ganesha samtang nagasulat sang Mahabharata. Ang ilag nga iya ginasakyan nagarepresentar sa ego nga angay controlaron."}},

  // === CELTIC ===
  {n:"Dagda",c:"Celtic",d:["Earth","Plenty","Magic","Life and Death"],r:{en:"The Good God, chief of the Tuatha De Danann. His cauldron never empties, his club kills and revives.",fil:"Ang Mabuting Diyos, pinuno ng Tuatha De Danann. Ang kanyang kaldero ay hindi kailanman nauubos, ang kanyang pamalo ay pumatay at muling binubuhay.",hil:"Ang Maayo nga Diyos, manunudlo sang Tuatha De Danann. Ang iya kaldero indi gid nauubos, ang iya garote nagapatay kag nagapabuhi liwat."},
    s:["Magic Cauldron","Magic Club","Harp"],g:"m",rel:["Morrigan","Brigid","Lugh"],story:{en:"The Dagda is the father-figure of the Celtic gods. His cauldron, the Undry, feeds all who come — none leave unsatisfied. His club kills with one end and revives with the other. He plays the harp that controls the seasons. Before the Second Battle of Mag Tuired, he single-handedly held off the Fomorians, eating enough porridge from a pit to feed an army, then fighting despite his bloated belly.",
      fil:"Si Dagda ang ama ng mga Celtic na diyos. Ang kanyang kaldero, ang Undry, nagpapakain sa lahat — walang umuuong gutom. Ang kanyang pamalo ay pumatay sa isang dulo at muling binubuhay sa kabilang dulo. Nagtutugtog siya ng harp na nagkokontrol sa mga panahon. Bago ang Ikalawang Labanan ng Mag Tuired, tinalo niya ang mga Fomorians nang mag-isa.",
      hil:"Si Dagda ang amay sang mga Celtic nga diyos. Ang iya kaldero, ang Undry, nagapakain sa tanan — wala nga nagapauli nga gutoon. Ang iya garote nagapatay sa isa ka kilid kag nagapabuhi liwat sa iban nga kilid. Nagatukar siya sang harp nga nagakontrol sang mga panahon. Antes sang Ika-duha nga Labanan sang Mag Tuired, gindaog niya ang mga Fomorians nagaisa."}},

  {n:"Morrigan",c:"Celtic",d:["War","Fate","Death","Prophecy"],r:{en:"Phantom queen, goddess of war and fate. Appears as a crow on the battlefield.",fil:"Phantom queen, diyosa ng digmaan at tadhana. Nagpapakita bilang uwak sa digmaan.",hil:"Phantom queen, diyosa sang gera kag tadhana. Nagapakita bilang uwak sa gera."},
    s:["Crow","Raven","Wolf"],g:"f",rel:["Dagda","Badb","Macha"],story:{en:"The Morrigan appears before battles as a crow, washing the armor of those doomed to die. She is three goddesses in one: Badb (frenzy), Macha (sovereignty), and Nemain (venom). Before the Battle of Mag Tuired, she mated with the Dagda and promised him victory. She is the fate that no warrior escapes.",
      fil:"Nagpapakita si Morrigan bago ang mga digmaan bilang uwak, naglalaba ng baluti ng mga taong nakatakding mamatay. Siya ay tatlong diyosa sa isa: Badb, Macha, at Nemain. Bago ang Labanan ng Mag Tuired, nagtalik siya kay Dagda at nagpangako sa kanya ng tagumpay. Siya ang tadhana na walang mandirigma ang makatakas.",
      hil:"Nagapakita si Morrigan antes sang mga gera bilang uwak, nagalaba sang baluti sang mga tao nga nakatakding mapatay. Siya tatlo ka diyosa sa isa: Badb, Macha, kag Nemain. Antes sang Labanan sang Mag Tuired, nagtalik siya kay Dagda kag nagpasugo sa iya sang daog. Siya ang tadhana nga wala sing mandirigma ang makalagyo."}},

  // === AZTEC ===
  {n:"Quetzalcoatl",c:"Aztec",d:["Wind","Learning","Creation","Civilization"],r:{en:"Feathered serpent, creator god and bringer of knowledge. Opposed human sacrifice.",fil:"Pakpak na ahas, diyos na lumikha at nagdala ng kaalaman. Tumutol sa pag-sacrifice ng tao.",hil:"Pakpak nga bitin, diyos nga naghimu kag nagdala sang kaalaman. Nagapangkot sa pag-sacrifice sang tao."},
    s:["Feathered Serpent","Wind","Venus"],g:"m",rel:["Tezcatlipoca","Huitzilopochtli"],story:{en:"Quetzalcoatl helped create the Fifth Sun by leaping into a pyre and rising as Venus. He descended into Mictlan to retrieve the bones of previous humanity, bleeding onto them to create the people of this age. He opposed human sacrifice, offering only butterflies and jade. But Tezcatlipoca tricked him into drunkenness and shame. Quetzalcoatl sailed east on a raft of serpents, promising to return.",
      fil:"Tinulungan ni Quetzalcoatl ang paglikha ng Fifth Sun sa pamamagitan ng paglukso sa apoy at pag-akyat bilang Venus. Bumaba siya sa Mictlan para kunin ang mga buto ng nakaraang sangkatauhan, nagdugo sa kanila para likhain ang mga tao ng panahong ito. Tumutol siya sa pag-sacrifice ng tao. Ngunit inlok siya ni Tezcatlipoca. Naglayag si Quetzalcoatl sa silangan sa raft ng mga ahas, nangakong babalik.",
      hil:"Ginbuligan ni Quetzalcoatl ang paghimo sang Fifth Sun paagi sang paglukso sa kalayo kag pag-akyat bilang Venus. Nagpanaog siya sa Mictlan para kuhaon ang mga tul-an sang mga-agi nga katawhan, nagapangdugo sa ila agod himuon ang mga tao sang sini nga panahon. Nagapangkot siya sa pag-sacrifice sang tao. Pero ginlimbong siya ni Tezcatlipoca. Naglayag si Quetzalcoatl sa sidlangan sa raft sang mga bitin, nagasuga nga magabalik."}},

  // === AKAN ===
  {n:"Anansi",c:"Akan",d:["Stories","Wisdom","Trickery","Knowledge"],r:{en:"Spider god of stories and trickery. Bought all the world's stories from the sky god Nyame.",fil:"Diyos ng mga kuwento at kalokohan. Binili niya ang lahat ng kuwento mula sa diyos ng langit na si Nyame.",hil:"Diyos sang mga isturya kag kalibangan. Ginkalipot niya ang tanan nga isturya halin sa diyos sang kalangitan nga si Nyame."},
    s:["Spider","Web","Stories"],g:"m",rel:["Nyame","Turtle","Leopard"],story:{en:"Anansi climbed to heaven on his silken thread and asked Nyame for the world's stories. Nyame set an impossible price: bring the hornets, the leopard, and the pythons. For the hornets, Anansi offered them a gourd to shelter from 'rain' — then tied it shut. For the leopard, he dug a pit and bound him. For the python, he tied him at both ends. Nyame handed over all the stories. 'From this day, they shall be called Spider Stories.'",
      fil:"Umaskad si Anansi sa langit sa kanyang hibla at humingi ng mga kuwento ni Nyame. Nagtakda si Nyame ng imposible na presyo: dalhin ang mga hornet, leopard, at python. Para sa hornet, inalok niya sila ng gourd — tapay itinali. Para sa leopard, naghukay siya ng pit at tinali siya. Para sa python, tinali niya sa magkabilang dulo. Ibinigay ni Nyame ang lahat ng kuwento. 'Mula ngayon, tatawaging Spider Stories ang mga ito.'",
      hil:"Nag-askad si Anansi sa kalangitan sa iya hibla kag nagpangayo sang mga isturya ni Nyame. Nagbutang si Nyame sang imposiblo nga presyo: dalhon ang mga hornet, leopard, kag python. Para sa hornet, gintanyag niya sila sang gourd — gani gintali. Para sa leopard, nagkalot siya sang pit kag gintali siya. Para sa python, gintali niya sa duha ka kilid. Ginhatag ni Nyame ang tanan nga isturya. 'Halin subong, tawagon ini Spider Stories.'"}},

  // =======================================
  // === PHILIPPINE MYTHOLOGY (NEW!) ===
  // =======================================
  {n:"Bathala",c:"Tagalog",d:["Creation","Sky","Supreme Rule"],r:{en:"Supreme god and creator of the universe in Tagalog mythology. Dwells in Kaluwalhatian, the highest heaven.",fil:"Pinakamataas na diyos at lumikha ng sansinukob sa mitolohiyang Tagalog. Nakatira sa Kaluwalhatian, ang pinakamataas na langit.",hil:"Pinakamaestra nga diyos kag manlalang sang kalibutan sa mitolohiyang Tagalog. Ara sa Kaluwalhatian, ang pinakamataas nga langit."},
    s:["Kaluwalhatian","Tigmamanukan Bird","Bamboo"],g:"m",rel:["Mayari","Tala","Apolaki","Amihan"],
    story:{en:"In the beginning, Bathala dwelt in Kaluwalhatian, the highest realm of the heavens, gazing down upon a formless world. He sent the Tigmamanukan bird as a sign — when it flew to the right, the journey was blessed; to the left, disaster awaited. One day, a bamboo floated ashore and cracked open. From it emerged Malakas (Strength) and Maganda (Beauty), the first humans. Bathala breathed life into them and taught them to farm, to fish, and to honor the spirits of nature — the anitos. He established the laws of the land and the rites of passage. To this day, before every important decision, the elders whisper: 'Sundin ang tanda ng Tigmamanukan' — Follow the sign of the omen bird.",
      fil:"Sa simula, nakatira si Bathala sa Kaluwalhatian, ang pinakamataas na kaharian ng langit, nakatingin sa walang hugis na mundo. Ipinadala niya ang ibong Tigmamanukan bilang tanda — kung lumipad ito sa kanan, pinagpapala ang paglalakbay; sa kaliwa, naghihintay ang sakuna. Isang araw, isang kawayan ang natapak sa pampang at nabiyak. Mula rito ay lumabas sina Malakas at Maganda, ang unang tao. Hiningahan sila ni Bathala ng buhay at tinuruan silang magtanim, mangisda, at igalang ang mga espiritu ng kalikasan — ang mga anito. Itinatag niya ang mga batas ng lupa at ang mga rito ng paglipas. Hanggang ngayon, bago ang bawat mahalagang desisyon, ang mga matatanda ay bumubulong: 'Sundin ang tanda ng Tigmamanukan.'",
      hil:"Sa una, ara si Bathala sa Kaluwalhatian, ang pinakamataas nga paghari-an sang kalangitan, nagatan-aw sa wala sing porma nga kalibutan. Ipinadala niya ang pispis nga Tigmamanukan bilang tanda — kon maglupad ini sa too, ginapala ang paglakat; sa wala, nagahulat ang kasakit. Isa ka adlaw, isa ka kawayan nagtapak sa baybayon kag nagbuka. Halin sini naglitaw sila Malakas kag Maganda, ang una nga mga tao. Ginhanginan ni Bathala sang kinabuhi kag gintudluan sila magtanom, mangisda, kag respetuhon ang mga espiritu sang kalikasan — ang mga anito. Gintindog niya ang mga kasuguan sang duta kag ang mga rito sang pagtabok. Hasta subong, antes sang tagsa ka importante nga desisyon, ang mga tigulaga nagahambal: 'Sundon ang tanda sang Tigmamanukan.'"}},

  {n:"Kan-Laon",c:"Visayan",d:["Creation","Time","Supreme Rule","Agriculture"],r:{en:"Supreme deity of Visayan mythology, dwelling in Mount Kanlaon. The ancient one who governs creation, time, and harvests.",fil:"Pinakamataas na diyos sa mitolohiyang Bisaya, nakatira sa Bundok Kanlaon. Ang sinauna na namamahala sa paglikha, oras, at ani.",hil:"Pinakamaestra nga diyos sa mitolohiyang Bisaya, ara sa Bundok Kanlaon. Ang daan nga nagadumala sang paghimo, tiempo, kag ani."},
    s:["Mount Kanlaon","Volcano","Rice","Sun"],g:"f",rel:["Sidapa","Lalahon","Maguayan"],
    story:{en:"Kan-Laon is the ancient supreme deity of the Visayan peoples, dwelling in the great volcano that bears her name — Mount Kanlaon on the island of Negros. She is both creator and destroyer: she gives the rice that feeds the people and the fire that can consume them. The Visayans say that when Kan-Laon is pleased, the harvests are abundant and the rivers run clear. When she is angered, the mountain smokes and trembles, and ash falls like black rain. The babaylans (shamans) would climb her slopes carrying offerings of rice, chicken, and palm wine, chanting ancient prayers in a language older than memory. Even after the Spanish came and renamed her mountain, the people whispered her true name at night. Kan-Laon means 'She Who Is Ancient' — and she is older than any religion that has tried to replace her.",
      fil:"Si Kan-Laon ang sinaunang pinakamataas na diyos ng mga Visayan, nakatira sa dakilang bulkan na nagngangalang Bundok Kanlaon sa isla ng Negros. Siya ay parehong lumilikha at tagapagwas: nagbibigay siya ng bigas na nagpapakain sa tao at ng apoy na pwedeng kainin sila. Sinasabi ng mga Visayan na kapag nasiyahan si Kan-Laon, sagana ang ani at malinaw ang mga ilog. Kapag nagalit siya, nagsusiga ang bundok at umuulan ng abo. Ang mga babaylan ay umaakyat sa kanyang mga dalisdis na may dalang handog ng bigas, manok, at tuba, umaawit ng sinaunang dasal. Kahit pagkatapos dumating ang mga Kastila, binubulung ng mga tao ang kanyang tunay na pangalan sa gabi. Ang Kan-Laon ay nangangahulugang 'Siya na Sinauna' — at siya ay mas matanda kaysa sa anumang relihiyong sumubok na palitan siya.",
      hil:"Si Kan-Laon ang daan nga pinakamaestra nga diyos sang mga Visayan, ara sa daku nga bulkan nga nagasing sang iya ngalan — Bundok Kanlaon sa isla sang Negros. Siya pareho sang manlalang kag tagapagwas: nagahatag siya sang humay nga nagapakain sang mga tawo kag sang kalayo nga makakaon sa ila. Ginahambal sang mga Visayan nga kon malipayon si Kan-Laon, sagana ang ani kag malinaw ang mga suba. Kon kasuko siya, nagasiga ang bundok kag nagaulan sang abo. Ang mga babaylan nagasakay sa iya mga dalisdis nga may dala sang halad sang humay, manok, kag tuba, nagakanta sang daan nga mga pangamuyo. Bisan pagkatapos sang mga Katsila, ginabulung sang mga tawo ang iya matuod nga ngalan sa gab-i. Ang Kan-Laon bukot sidlon 'Siya nga Sinauna' — kag siya mas tigulang sang bisan ano nga relihiyon nga nagprubar singlipon siya."}},

  {n:"Sidapa",c:"Visayan",d:["Death","Fate","Lifespans"],r:{en:"God of death who measures the lifespans of mortals with a sacred tree on Mount Madia-as.",fil:"Diyos ng kamatayan na sumusukat ng buhay ng mga tao gamit ang sagradong puno sa Bundok Madia-as.",hil:"Diyos sang kamatayon nga nagasukol sang kinabuhi sang mga tawo gamit ang sagradong kahoy sa Bundok Madia-as."},
    s:["Sacred Tree","Mount Madia-as","Scales","Stars"],g:"m",rel:["Kan-Laon","Maguayan","Lalahon"],
    story:{en:"Sidapa stands atop Mount Madia-as in the province of Antique, where he tends a great tree whose leaves each bear the name of a mortal. When a leaf falls, a life ends. When a bud opens, a child is born. But Sidapa is not cruel — he simply reads the measure that fate has written. The Visayans say that he consults the stars before claiming a soul, for the stars were placed in the sky by the ancient ones to mark the appointed hours. When a person dies peacefully in old age, Sidapa has gently loosened the leaf. When a person dies young, a strong wind has shaken the tree. The babaylans pray to Sidapa not to extend life — for that is impossible — but to grant a good death, surrounded by family, with enough breath left for final words. This is the greatest gift the god of death can give.",
      fil:"Nakatayo si Sidapa sa itaas ng Bundok Madia-as sa Antique, kung saan nag-aalaga siya ng isang dakilang puno na ang bawat dahon ay may pangalan ng isang tao. Kapag bumagsak ang dahon, natapos ang isang buhay. Kapag bumukas ang usbong, isang bata ay ipinanganak. Ngunit hindi malupit si Sidapa — binabasa lang niya ang sukat na isinulat ng tadhana. Sinasabi ng mga Visayan na sumasangguni siya sa mga bituin bago kunin ang isang kaluluwa. Kapag namatay nang mapayapa sa katandaan, marahang tinanggal ni Sidapa ang dahon. Kapag namatay nang maaga, isang malakas na hangin ang yumayugyog sa puno. Nagdarasal ang mga babaylan kay Sidapa hindi para pahabain ang buhay — kundi para bigyan ng mabuting kamatayan.",
      hil:"Nagatindog si Sidapa sa ibabaw sang Bundok Madia-as sa Antique, diin siya nagabantay sang daku nga kahoy nga ang tagsa ka dahon may ngalan sang isa ka tawo. Kon magpatir ang dahon, natapos ang isa ka kinabuhi. Kon magbukas ang usbong, isa ka bata natawo. Pero indi malain si Sidapa — gibasa lang niya ang sukot nga ginsulat sang tadhana. Ginahambal sang mga Visayan nga nagapangotana siya sa mga bitoon antes kuhaon ang isa ka kalag. Kon mapatay sing mabati sa katigulangan, mahinayhon nga ginkuha ni Sidapa ang dahon. Kon mapatay sing mayo, isa ka kusog nga hangin ang nagapalog sang kahoy. Nagapangamuyo ang mga babaylan kay Sidapa indi para padugayon ang kinabuhi — kundi para maghatag sing maayo nga kamatayon."}},

  {n:"Lalahon",c:"Visayan",d:["Fire","Volcanoes","Harvest"],r:{en:"Goddess of fire and volcanoes who dwells in the fiery mouth of Mount Kanlaon. She brings both destruction and fertile harvests.",fil:"Diyosa ng apoy at bulkan na nakatira sa nagliliyab na bibig ng Bundok Kanlaon. Nagdudala siya ng pagkawasak at masaganang ani.",hil:"Diyosa sang kalayo kag bulkan nga ara sa nagasiga sang baba sang Bundok Kanlaon. Nagadala siya sang pagpanas kag sagana nga ani."},
    s:["Volcano","Fire","Rice Fields","Ash"],g:"f",rel:["Kan-Laon","Sidapa","Maguayan"],
    story:{en:"Lalahon is the fire goddess who makes her home in the crater of Mount Kanlaon. When she walks, the earth trembles. When she breathes, smoke rises. But Lalahon is not merely destruction — she is the volcanic fire that makes the soil fertile. The Visayan farmers know that the lands near the volcano produce the sweetest rice and the tallest sugarcane, for Lalahon's ash feeds the earth. She teaches that creation and destruction are one fire: the same flame that burns the forest also returns its nutrients to the soil. When Lalahon is honored with proper ritual, she holds her fire. When she is neglected, she reminds the people of her power — not out of malice, but because the contract between gods and mortals must be renewed with every generation.",
      fil:"Si Lalahon ang diyosa ng apoy na nakatira sa kater ng Bundok Kanlaon. Kapag siya ay naglalakad, nanginginig ang lupa. Kapag siya ay humihinga, umuusok. Ngunit hindi lamang pagkawasak si Lalahon — siya ang bulkanikong apoy na nagpapabunga sa lupa. Alam ng mga magsasakang Visayan na ang mga lupain malapit sa bulkan ay lumilikha ng pinakamatamis na bigas at pinakamatangkad na tubo, dahil ang abo ni Lalahon ay nagpapakain sa lupa. Itinuturo niya na ang paglikha at pagkawasak ay iisang apoy: ang parehong liyab na sumusunog sa gubat ay nagbabalik ng sustansya sa lupa. Kapag iginagalang si Lalahon ng tamang rito, pinipigilan niya ang kanyang apoy.",
      hil:"Si Lalahon ang diyosa sang kalayo nga nagaestar sa kater sang Bundok Kanlaon. Kon siya nagalakat, nagakurog ang duta. Kon siya nagahangin, nagasiga. Pero indi lang pagpanas si Lalahon — siya ang bulkanikong kalayo nga nagapabunga sang duta. Kabalo ang mga uma nga bisaya nga ang mga duta malapit sa bulkan nagahimo sang pinakatam-is nga humay kag pinakamataas nga tubo, kay ang abo ni Lalahon nagapakain sang duta. Gintudluan niya nga ang paghimo kag pagpanas isa lang ka kalayo: ang pareho nga lapa nga nagasunog sa kagubatan nagabalik sang sustansya sa duta. Kon ginatahod si Lalahon sang tama nga rito, ginapunggan niya ang iya kalayo."}},

  {n:"Maguayan",c:"Visayan",d:["Sea","Water","Navigation","Afterlife"],r:{en:"God of the sea and ruler of the waters. He ferries the dead to the underworld and commands all ocean spirits.",fil:"Diyos ng dagat at pinuno ng tubig. Iginigiya niya ang mga patay sa underworld at nag-uutos sa lahat ng espiritu ng karagatan.",hil:"Diyos sang dagat kag manunudlo sang tubig. Igiya niya ang mga minatay sa underworld kag nagagutos sa tanan nga espiritu sang karagatan."},
    s:["Sea","Boat","Fish","Tidal Waves"],g:"m",rel:["Kan-Laon","Sidapa","Lalahon"],
    story:{en:"Maguayan rules the waters that surround the Visayan islands — and the waters that divide the world of the living from the world of the dead. When Sidapa claims a soul, it is Maguayan who ferries it across the dark sea to the underworld. His boat appears at the shore when the moon is dark, and no living person may board it. Fishermen honor Maguayan before every voyage, spilling palm wine into the waves and whispering: 'Maguayan, itaas mo ang laot' — Maguayan, calm the sea. For he can summon storms that swallow fleets, or grant safe passage through the deepest waters. The Visayans say that when the tide is unusually low, Maguayan has drawn the water aside to let the dead pass. When it rises suddenly, his boat has returned empty, and the sea reclaims what was borrowed.",
      fil:"Namumuno si Maguayan sa tubig na nakapaligid sa mga isla ng Visayas — at sa tubig na naghihiwalay sa mundo ng buhay at mundo ng mga patay. Kapag kinuha ni Sidapa ang isang kaluluwa, si Maguayan ang naglalakbay nito sa madilim na dagat papunta sa underworld. Ang kanyang bangka ay lumilitaw sa baybayin kapag madilim ang buwan, at walang buhay na tao ang pwedeng sumakay. Iginagalang siya ng mga mangingisda bago ang bawat paglalakbay, nagbubuhos ng tuba sa alon at bumubulong: 'Maguayan, itaas mo ang laot.' Siya ang pwedeng mag-imbok ng bagyo o magbigay ng ligtas na paglalakbay.",
      hil:"Nagadumala si Maguayan sa tubig nga nagapalibot sa mga isla sang Visayas — kag sa tubig nga nagabulag sa kalibutan sang buhi kag kalibutan sang mga minatay. Kon kuhaon ni Sidapa ang isa ka kalag, si Maguayan ang nagalakat sini sa madulom nga dagat pakadto sa underworld. Ang iya bangka nagapakita sa baybayon kon madulom ang bulan, kag wala sing buhi nga tawo ang makasakay. Ginatahod siya sang mga mangingisda antes sang tagsa ka paglakat, nagabulos sang tuba sa balud kag nagabulung: 'Maguayan, itaas mo ang laot.' Siya ang pwede magpanukob sang bagyo ukon maghatag sing ligtas nga paglakat."}},

  {n:"Mayari",c:"Tagalog",d:["Moon","Beauty","Night"],r:{en:"Goddess of the moon and beauty in Tagalog mythology. Daughter of Bathala who lost one eye in battle with her brother Apolaki.",fil:"Diyosa ng buwan at kagandahan sa mitolohiyang Tagalog. Anak ni Bathala na nawalan ng isang mata sa laban sa kanyang kapatid na si Apolaki.",hil:"Diyosa sang bulan kag katahom sa mitolohiyang Tagalog. Anak ni Bathala nga nawad-an sang isa ka mata sa-away sa iya utod nga si Apolaki."},
    s:["Moon","Silver Light","Blind Eye"],g:"f",rel:["Bathala","Apolaki","Tala","Amihan"],
    story:{en:"Mayari and her brother Apolaki, children of Bathala, once ruled the world together in harmony — she the night, he the day. But Apolaki grew dissatisfied and demanded sole rulership. Mayari refused, and they fought a terrible battle. In the struggle, Apolaki struck Mayari's face, blinding her in one eye. Horrified by what he had done, Apolaki relented and agreed to shared rule. But because Mayari's light was now diminished, the moon would shine less brightly than the sun. The Tagalog people say this is why moonlight is softer than sunlight — it is the light of a goddess who sacrificed half her brightness for peace. And on clear nights, you can see the shadow on the moon's face — the mark of Apolaki's blow, and the price of shared power.",
      fil:"Sina Mayari at Apolaki, mga anak ni Bathala, ay minsang namuno sa mundo nang magkasama — siya ang gabi, siya ang araw. Ngunit hindi nasiyahan si Apolaki at humingi ng tanging pamumuno. Tumanggi si Mayari, at sila ay naglaban. Sa pakikipaglaban, sinaktan ni Apolaki ang mukha ni Mayari at siya'y nabulag sa isang mata. Natakot si Apolaki sa kanyang ginawa at sumang-ayon sa pamumunong magkasama. Ngunit dahil nawala ang kalahati ng liwanag ni Mayari, ang buwan ay hindi na kasing liwanag ng araw. Ito ang dahilan kung bakit ang liwanag ng buwan ay mas mahinahon — ito ang liwanag ng isang diyosang nagpakasakripisyo para sa kapayapaan.",
      hil:"Sila Mayari kag Apolaki, mga anak ni Bathala, sang una nagadumala sa kalibutan magkaduha — siya ang gab-i, siya ang adlaw. Pero indi naging kontento si Apolaki kag nagpangayo sang solo nga pagdumala. Nagpangkot si Mayari, kag sila nag-away. Sa away, gintigo ni Apolaki ang nawong ni Mayari kag nabuta siya sa isa ka mata. Nagkahadlok si Apolaki sa iya ginhimo kag nagpasugot sa magkahos nga pagdumala. Pero tungod kay nagkawa sang katunga ang kasanag ni Mayari, ang bulan indi na kasanag sang adlaw. Ini ang rason kon ngaa ang kasanag sang bulan mas lumo — ini ang kasanag sang isa ka diyosa nga nagpasakripisyo para sa kappayapaan."}},

  {n:"Apolaki",c:"Tagalog",d:["War","Sun","Courage"],r:{en:"God of war and the sun in Tagalog mythology. Son of Bathala, who fought his sister Mayari for sole rulership of the world.",fil:"Diyos ng digmaan at araw sa mitolohiyang Tagalog. Anak ni Bathala, na lumaban sa kanyang kapatid na si Mayari para sa tanging pamumuno.",hil:"Diyos sang gera kag adlaw sa mitolohiyang Tagalog. Anak ni Bathala, nga nag-away sa iya utod nga si Mayari para sa solo nga pagdumala."},
    s:["Sun","Sword","Fire"],g:"m",rel:["Bathala","Mayari","Tala"],
    story:{en:"Apolaki is the warrior god of the Tagalogs, son of Bathala, whose very name means 'Big Lord' or 'Lord of War.' He and his sister Mayari once shared rulership of the world — he commanded the day, she the night. But Apolaki, fierce and proud, believed that the sun should rule alone. The battle between them shook the heavens, and in his fury, Apolaki struck Mayari and blinded one eye. The sight of his sister's wound broke his rage. He agreed to share power, but the damage was done — the moon would forever shine less brightly than the sun. Apolaki teaches that strength without wisdom wounds those we love. The bravest warriors are not those who never yield, but those who know when to stop.",
      fil:"Si Apolaki ang diyos ng digmaan ng mga Tagalog, anak ni Bathala, na ang pangalan ay nangangahulugang 'Dakilang Panginoon.' Siya at ang kanyang kapatid na si Mayari ay minsang naghati sa pamumuno — siya ang araw, siya ang gabi. Ngunit si Apolaki, na matapang at mayabang, ay naniwala na ang araw dapat mag-isa. Ang labanan sa kanila ay yuminig sa langit, at sa kanyang galit, sinaktan niya si Mayari at nabulag ang isang mata niya. Ang pagkakita sa sugat ng kanyang kapatid ay sumira sa kanyang galit. Pumayag siyang maghati, ngunit ang pinsala ay ginawa na — ang buwan ay palaging mas madilim kaysa araw. Itinuturo ni Apolaki na ang lakas nang walang karunungan ay nasasaktan ang mga minamahal.",
      hil:"Si Apolaki ang diyos sang gera sang mga Tagalog, anak ni Bathala, nga ang ngalan bukot sidlon 'Daku nga Agalon.' Siya kag ang iya utod nga si Mayari sang una nagbahin sa pagdumala — siya ang adlaw, siya ang gab-i. Pero si Apolaki, nga maisog kag palalo, nagpati nga ang adlaw dapat mag-isa. Ang away sa ila nagpaninog sa kalangitan, kag sa iya kasuko, gintigo niya si Mayari kag nabuta ang isa ka mata niya. Ang pagkakita sa balat sang iya utod nagpanas sang iya kasuko. Nagpasugot siya magbahin, pero ang kadaot ginhimo na — ang bulan permi mas madulom sa adlaw. Gintudluan ni Apolaki nga ang kusog nga wala sing kaalam nagasakitan sang mga ginalikop."}},

  {n:"Amihan",c:"Tagalog",d:["Wind","Storm","Freedom"],r:{en:"Goddess of the northeast wind who freed the first humans from the bamboo and carries the spirits of the departed.",fil:"Diyosa ng hilagang-silangang hangin na nagpalaya sa mga unang tao mula sa kawayan at nagdadala ng mga kaluluwa ng yumao.",hil:"Diyosa sang amihan nga hangin nga naghaw-as sang mga una nga tawo halin sa kawayan kag nagadala sang mga kalag sang nanghaye."},
    s:["Northeast Wind","Bamboo","Feathers"],g:"f",rel:["Bathala","Mayari","Tala","Malakas","Maganda"],
    story:{en:"When the bamboo cracked open on the shore and Malakas and Maganda emerged, they were trapped inside — unable to free themselves. It was Amihan, the northeast wind, who split the bamboo apart and set the first humans free. She blew across the waters and stirred the first breath into their lungs. Ever since, Amihan has been the wind of new beginnings — the breeze that arrives with the cool season, clearing the skies and bringing relief from the heat. The Tagalogs say that when Amihan blows, the old year is ending and a new one is coming. She is also the wind that carries the souls of the dead across the sea to the afterlife, for the one who freed humanity from its first prison also guides it through its last passage.",
      fil:"Nang bumuka ang kawayan sa baybayin at lumabas sina Malakas at Maganda, hindi sila makalabas — hindi makapalaya. Si Amihan, ang hilagang-silangang hangin, ang bumuka sa kawayan at nagpalaya sa mga unang tao. Humangin siya sa tubig at nagbigay ng unang hinga sa kanilang baga. Mula noon, si Amihan ay naging hangin ng mga bagong simula — ang hangin na dumarating sa malamig na panahon. Sinasabi ng mga Tagalog na kapag humihip ang Amihan, ang lumang taon ay nagtatapos at ang bago ay dumarating. Siya rin ang hangin na nagdadala ng mga kaluluwa ng patay sa kabilang buhay.",
      hil:"Sang nagbuka ang kawayan sa baybayon kag naglitaw sila Malakas kag Maganda, indi sila makagwa — indi makahaw-as. Si Amihan, ang amihan nga hangin, ang nagbuka sa kawayan kag nagpahaw-as sang mga una nga tawo. Naghangin siya sa tubig kag naghatag sang una nga hanga sa ila baga. Halin sadto, si Amihan naging hangin sang mga bag-o nga umpisa — ang hangin nga nagaka-abot sa malami nga panahon. Ginahambal sang mga Tagalog nga kon magahangin si Amihan, ang daan nga tuig nagatapos kag ang bag-o nagaka-abot. Siya man ang hangin nga nagadala sang mga kalag sang minatay sa kabilang bahin sang kinabuhi."}}
