// ============================================================
class NLP {
  constructor(){
    this.fm={};
    KB.forEach(f=>{this.fm[f.n.toLowerCase()]=f});
    this.ck=Object.keys(CUL).map(c=>c.toLowerCase());
    // Also add common alternate names
    this.aliases={"kanlaon":"kan-laon","kan-laon":"kan-laon"};
  }
  process(input){
    try{
      const l=(input||"").toLowerCase().trim();
      const tk=l.split(/\s+/).filter(t=>t.length>0);
      const lang=detectLang(input);
      return{intent:this.ci(l,tk,lang),entities:this.ee(l,tk),tokens:tk,original:input,lang};
    }catch(e){return{intent:"general",entities:{figures:[],cultures:[],pronouns:[]},tokens:[],original:input,lang:'en'}}
  }
  ci(l,tk,lang){
    const s={};
    // Greeting
    const gEn=['hello','hi','hey','greetings','howdy'];
    const gFil=['kumusta','magandang araw','magandang gabi','kamusta','mabuhay'];
    const gHil=['kumusta','maayong adlaw','maayong gab-i','maayo'];
    if(tk.some(t=>[...gEn,...gFil,...gHil].includes(t)))s.greeting=3;
    // Ask about
    const aEn=['who is','who are','tell me about','what is','describe','explain','more about','know about','tell me more'];
    const aFil=['sino si','sino sina','magkwento tungkol','anu-ano','ipaliwanag','sabihin mo tungkol','kwento about','sino ba si'];
    const aHil=['kinsa si','kinsa sina','sugilon about','hambalon about','ano si','sugilon mo si','hambalon mo si','kinsa bala si'];
    if([...aEn,...aFil,...aHil].some(p=>l.includes(p)))s.ask=3;
    // Compare
    const cEn=['compare','difference between',' vs ',' versus ','similarities'];
    const cFil=['ihambing','pagkakaiba ng','ihambing mo'];
    const cHil=['ihambing','pagkakaiba sang','ihambing mo'];
    if([...cEn,...cFil,...cHil].some(p=>l.includes(p)))s.compare=3;
    // List
    const lEn=['list','show me','names of','gods of','deities of','who are the','pantheon','all the'];
    const lFil=['ilista','ipakita ang','mga diyos ng','sino-sino ang','lahat ng'];
    const lHil=['ilista','ipakita ang','mga diyos sang','kinsa-kinsa ang','tanan nga'];
    if([...lEn,...lFil,...lHil].some(p=>l.includes(p)))s.list=2;
    // Story
    const sEn=['tell me a story','narrate','myth about','legend of','tale of','story of','story about'];
    const sFil=['magkwento','ikwento mo','kwento tungkol','kwento ni','istorya ni','alamat ni','mito ni'];
    const sHil=['sugilon mo','sugilanon','hambalon mo ang','istorya ni','alamat ni','mito ni'];
    if([...sEn,...sFil,...sHil].some(p=>l.includes(p)))s.story=3;
    // Save
    const svEn=['save','bookmark','add to collection','remember this'];
    const svFil=['i-save','itago','irekord','tandaan ito'];
    const svHil=['i-save','itago','irekord','tandai ini'];
    if([...svEn,...svFil,...svHil].some(p=>l.includes(p)))s.save=2;
    // View collection
    const vEn=['my collection','show collection','saved items','favorites'];
    const vFil=['koleksyon ko','ipakita ang koleksyon','mga na-save'];
    const vHil=['koleksyon ko','ipakita ang koleksyon','mga na-save'];
    if([...vEn,...vFil,...vHil].some(p=>l.includes(p)))s.view=2;
    // Help
    const hEn=['help','what can you do','how to use','instructions','guide','what do you know'];
    const hFil=['tulungan mo','tulong','paano gamitin','gabay','ano ang kaya mo','anong alam mo'];
    const hHil=['buligi ako','bulig','paano gamiton','giya','ano ang kaya mo','ano ang kabalo mo'];
    if([...hEn,...hFil,...hHil].some(p=>l.includes(p)))s.help=3;
    // Thanks
    const tEn=['thanks','thank you','appreciated','awesome','great'];
    const tFil=['salamat','maraming salamat','salamat po','pasalamat'];
    const tHil=['salamat','salamat gid','madamo nga salamat'];
    if([...tEn,...tFil,...tHil].some(p=>l.includes(p)))s.thanks=2;
    // Goodbye
    const bEn=['bye','goodbye','see you','farewell'];
    const bFil=['paalam','sige','hanggang sa muli'];
    const bHil=['paalam','sige','hasta sa liwat','panghimaton'];
    if([...bEn,...bFil,...bHil].some(p=>l.includes(p)))s.bye=3;

    if(this.ff(l).length>0&&!s.ask&&!s.compare)s.ask=1;
    if(this.fc(l).length>0&&!s.list&&!s.ask)s.list=1;
    const sorted=Object.entries(s).sort((a,b)=>b[1]-a[1]);
    return sorted.length>0?sorted[0][0]:'general';
  }
  ee(l,tk){return{figures:this.ff(l),cultures:this.fc(l),pronouns:this.fp(tk)}}
  ff(l){
    const f=[];
    for(const n of Object.keys(this.fm)){
      const rx=new RegExp('\\b'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b');
      if(rx.test(l))f.push(this.fm[n]);
    }
    // Check aliases
    for(const[alias,target]of Object.entries(this.aliases)){
      if(l.includes(alias)&&!f.find(x=>x.n.toLowerCase()===target))f.push(this.fm[target]);
    }
    return f;
  }
  fc(l){return this.ck.filter(c=>l.includes(c)).map(c=>c.charAt(0).toUpperCase()+c.slice(1))}
  fp(tk){const p=[];if(tk.some(t=>['he','him','his','siya','niya'].includes(t)))p.push('m');if(tk.some(t=>['she','her','hers','siya','niya'].includes(t)))p.push('f');return p}
}

class CTX{constructor(){this.reset()}reset(){this.cf=null;this.cc=null;this.mf=[];this.flow='idle';this.li=null;this.cl='en'}
  update(nr){try{const{i,e}=nr;this.li=i;this.cl=nr.lang||'en';if(e.pronouns.length>0&&this.cf&&e.figures.length===0)nr.entities.figures=[this.cf];if(e.figures.length>0){if(e.figures.length>=2)this.flow='comparing';else{this.cf=e.figures[0];this.flow='exploring';if(!this.mf.find(f=>f.n===this.cf.n))this.mf.push(this.cf)}}if(e.cultures.length>0)this.cc=e.cultures[0];else if(this.cf)this.cc=this.cf.c;if(i==='story')this.flow='storytelling';if(i==='greeting'||i==='bye')this.flow='idle';if(['ask','story'].includes(i)&&e.figures.length===0&&this.cf)nr.entities.figures=[this.cf]}catch(e){}}
  gs(){let c='';if(this.cf)c+=`Discussing: ${this.cf.n} (${this.cf.c}). `;if(this.cc)c+=`Culture: ${this.cc}. `;return c}}

class DB_{constructor(){this.db=null}async init(){return new Promise((r,j)=>{const rq=indexedDB.open('LoreKeeperDB',2);rq.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('msg'))d.createObjectStore('msg',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('col')){const s=d.createObjectStore('col',{keyPath:'id',autoIncrement:true});s.createIndex('name','name',{unique:false})}};rq.onsuccess=e=>{this.db=e.target.result;r()};rq.onerror=e=>j(e.target.error)})}
  async sm(role,content,meta={}){try{const tx=this.db.transaction('msg','readwrite');tx.objectStore('msg').add({role,content,meta,ts:Date.now()});return new Promise(r=>{tx.oncomplete=()=>r()})}catch(e){}}
  async gm(lim=50){try{const tx=this.db.transaction('msg','readonly');const rq=tx.objectStore('msg').getAll();return new Promise(r=>{rq.onsuccess=()=>r(rq.result.slice(-lim));rq.onerror=()=>r([])})}catch(e){return[]}}
  async cm(){try{const tx=this.db.transaction('msg','readwrite');tx.objectStore('msg').clear();return new Promise(r=>{tx.oncomplete=()=>r()})}catch(e){}}
  async sc(fig){try{const ex=await this.gc();if(ex.find(f=>f.name===fig.n))return false;const tx=this.db.transaction('col','readwrite');tx.objectStore('col').add({name:fig.n,culture:fig.c,domain:fig.d,role:fig.r.en,savedAt:Date.now()});return new Promise(r=>{tx.oncomplete=()=>r(true);tx.onerror=()=>r(false)})}catch(e){return false}}
  async gc(){try{const tx=this.db.transaction('col','readonly');const rq=tx.objectStore('col').getAll();return new Promise(r=>{rq.onsuccess=()=>r(rq.result||[]);rq.onerror=()=>r([])})}catch(e){return[]}}
  async rc(id){try{const tx=this.db.transaction('col','readwrite');tx.objectStore('col').delete(id);return new Promise(r=>{
