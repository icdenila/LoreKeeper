<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoreKeeper — Mythology & Folklore Chatbot</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0b1118; --bg2: #111a25; --card: #16202e; --card-h: #1b2840;
    --bdr: #243044; --fg: #e4dac6; --fg2: #94a3b8; --acc: #c4952e;
    --acc-h: #daa740; --acc-g: rgba(196,149,48,0.12); --bot: #142030;
    --usr: #17304d; --ok: #2f8a50; --err: #b93e3e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--fg);overflow:hidden;height:100vh}
  h1,h2,h3,h4,.fd{font-family:'Cinzel',serif}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
  .mi{animation:ms .35s ease-out}
  @keyframes ms{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .td{width:8px;height:8px;background:var(--acc);border-radius:50%;animation:tb 1.2s infinite}
  .td:nth-child(2){animation-delay:.15s}.td:nth-child(3){animation-delay:.3s}
  @keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-8px);opacity:1}}
  .ch{transition:all .2s;cursor:pointer}.ch:hover{background:var(--acc);color:var(--bg);transform:translateY(-1px)}
  .fc{background:var(--card);border:1px solid var(--bdr);border-radius:12px;transition:border-color .2s}.fc:hover{border-color:var(--acc)}
  #sb{transition:transform .3s ease}
  @media(max-width:768px){#sb{position:fixed;z-index:50;transform:translateX(-100%)}#sb.op{transform:translateX(0)}#sov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}#sov.op{display:block}}
  .to{animation:ti .3s ease-out,to .3s ease-in 2.7s;animation-fill-mode:forwards}
  @keyframes ti{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
  @keyframes to{from{opacity:1}to{opacity:0;transform:translateX(40px)}}
  .ci{transition:all .2s}.ci:hover{background:var(--card-h)}
  .lg{animation:gp 3s ease-in-out infinite}
  @keyframes gp{0%,100%{text-shadow:0 0 8px rgba(196,149,48,.3)}50%{text-shadow:0 0 20px rgba(196,149,48,.6)}}
  #ci:focus{outline:none;box-shadow:0 0 0 2px rgba(196,149,48,.4)}
  #pc{position:fixed;inset:0;z-index:0;pointer-events:none}
  .tb{transition:all .2s}.tb.ac{color:var(--acc);border-bottom:2px solid var(--acc)}
  .ab{transition:all .15s}.ab:hover{background:var(--acc-g);border-color:var(--acc)}
  .sb{font-size:10px;padding:2px 8px;border-radius:9999px;display:inline-flex;align-items:center;gap:4px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="pc"></canvas>
<div id="sov" onclick="tsb(false)"></div>
<div class="flex h-screen relative z-10">
  <aside id="sb" class="w-72 flex-shrink-0 bg-[var(--bg2)] border-r border-[var(--bdr)] flex flex-col h-full">
    <div class="p-5 border-b border-[var(--bdr)]">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-[var(--acc)] to-amber-700 flex items-center justify-center"><i class="fas fa-book-open text-[var(--bg)] text-lg"></i></div>
        <div><h1 class="fd text-lg text-[var(--acc)] lg leading-tight">LoreKeeper</h1><p class="text-xs text-[var(--fg2)]">Mythology & Folklore</p></div>
      </div>
    </div>
    <div class="flex border-b border-[var(--bdr)]">
      <button class="tb ac flex-1 py-3 text-sm font-medium text-center" data-t="col" onclick="st('col')"><i class="fas fa-bookmark mr-1"></i>Collection</button>
      <button class="tb flex-1 py-3 text-sm font-medium text-center text-[var(--fg2)]" data-t="his" onclick="st('his')"><i class="fas fa-clock-rotate-left mr-1"></i>History</button>
    </div>
    <div id="tcol" class="flex-1 overflow-y-auto p-3"><div id="cl"></div></div>
    <div id="this" class="flex-1 overflow-y-auto p-3 hidden"><div id="hl"></div></div>
    <div class="p-4 border-t border-[var(--bdr)]">
      <button onclick="cad()" class="ab w-full py-2 px-3 rounded-lg border border-[var(--bdr)] text-sm text-[var(--fg2)] hover:text-[var(--err)]"><i class="fas fa-trash-can mr-2"></i>Clear All Data</button>
    </div>
  </aside>
  <main class="flex-1 flex flex-col min-w-0">
    <header class="flex items-center justify-between px-4 md:px-6 py-3 border-b border-[var(--bdr)] bg-[var(--bg2)]/80 backdrop-blur-sm">
      <div class="flex items-center gap-3">
        <button onclick="tsb(true)" class="md:hidden w-9 h-9 rounded-lg border border-[var(--bdr)] flex items-center justify-center text-[var(--fg2)] hover:text-[var(--fg)]"><i class="fas fa-bars"></i></button>
        <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div><span class="text-sm text-[var(--fg2)]">LoreKeeper — Local Mode</span></div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="ec()" class="w-9 h-9 rounded-lg border border-[var(--bdr)] flex items-center justify-center text-[var(--fg2)] hover:text-[var(--fg)]" title="Export"><i class="fas fa-download text-sm"></i></button>
        <button onclick="cc()" class="w-9 h-9 rounded-lg border border-[var(--bdr)] flex items-center justify-center text-[var(--fg2)] hover:text-[var(--fg)]" title="New Chat"><i class="fas fa-plus text-sm"></i></button>
      </div>
    </header>
    <div id="cm" class="flex-1 overflow-y-auto px-4 md:px-6 py-4 space-y-4"></div>
    <div class="px-4 md:px-6 pb-4 pt-2 border-t border-[var(--bdr)] bg-[var(--bg2)]/60 backdrop-blur-sm">
      <div class="flex items-end gap-3 max-w-3xl mx-auto">
        <div class="flex-1 relative">
          <textarea id="ci" rows="1" placeholder="Ask about any myth, deity, or legend..." class="w-full resize-none rounded-xl border border-[var(--bdr)] bg-[var(--card)] px-4 py-3 pr-12 text-sm text-[var(--fg)] placeholder:text-[var(--fg2)]/50 focus:border-[var(--acc)]" onkeydown="hik(event)" oninput="ars(this)"></textarea>
          <button onclick="sm()" class="absolute right-2 bottom-2 w-8 h-8 rounded-lg bg-[var(--acc)] hover:bg-[var(--acc-h)] flex items-center justify-center text-[var(--bg)] transition-colors" aria-label="Send"><i class="fas fa-paper-plane text-sm"></i></button>
        </div>
      </div>
      <div class="flex flex-wrap gap-2 mt-3 max-w-3xl mx-auto" id="qc"></div>
    </div>
  </main>
</div>
<div id="tc" class="fixed top-4 right-4 z-[100] space-y-2"></div>

<script>
// ============================================================
// MASSIVE KNOWLEDGE BASE — 34 figures with rich detail
// ============================================================
const DB = [
  {n:"Zeus",c:"Greek",d:["Sky","Thunder","Law","Kingship"],r:"King of the Olympian gods, wielder of the thunderbolt. He rules from Mount Olympus, enforcing oaths and cosmic order. Father of many heroes and gods, his temper shakes the very earth.",s:["Thunderbolt","Eagle","Oak Tree","Aegis Shield"],g:"m",rel:["Hera","Poseidon","Athena","Hades","Apollo"],w:"Zeus",
   story:"The tale of Zeus begins in darkness. His father Cronus, Titan lord of time, devoured each of his children at birth — for a prophecy foretold that his own son would overthrow him, just as Cronus had overthrown his father Uranus. But Rhea, grief-stricken, wrapped a stone in swaddling clothes and fed it to Cronus instead. She hid the infant Zeus in a cave on Crete, where the Curetes clashed their shields to drown his cries. When Zeus grew to manhood, he returned disguised as a cupbearer. He gave Cronus a draught of mustard and wine that forced him to disgorge Zeus's siblings — Hestia, Demeter, Hera, Hades, and Poseidon — all alive and whole. Thus began the Titanomachy: ten years of war between the Olympians and the Titans. With the Hundred-Handed Ones and Cyclopes as allies, Zeus cast Cronus into Tartarus and claimed the sky as his domain. From that day, his thunderbolt has been the final word in every divine dispute."},
  {n:"Hera",c:"Greek",d:["Marriage","Women","Childbirth","Sovereignty"],r:"Queen of the Olympian gods, protector of marriage and women. Known for her jealous wrath against Zeus's lovers, yet she remains the most powerful goddess on Olympus.",s:["Peacock","Cow","Pomegranate","Diadem"],g:"f",rel:["Zeus","Hephaestus","Ares","Hebe"],w:"Hera",
   story:"Hera's devotion to marriage is both her strength and her torment. When Zeus first pursued her, she refused him — until he transformed himself into a shivering cuckoo. Taking pity on the bird, she held it to her breast, and Zeus revealed his true form. Yet this marriage, consecrated on Olympus, became her eternal trial. When Zeus loved the mortal Io, Hera turned the girl into a cow and set Argus with his hundred eyes to guard her. When Zeus loved Leto, Hera forbade any land to give her shelter — yet Delos, a floating island, defied her decree so Apollo and Artemis could be born. But Hera's wrath was not mere pettiness — it was the fury of a goddess who understood that the sanctity of marriage was the foundation of civilization itself."},
  {n:"Poseidon",c:"Greek",d:["Sea","Earthquakes","Horses","Islands"],r:"God of the sea and earthquakes, creator of the first horse. Brother of Zeus and Hades, his moods govern the fate of every sailor.",s:["Trident","Horse","Dolphin","Bull"],g:"m",rel:["Zeus","Hades","Amphitrite","Theseus"],w:"Poseidon",
   story:"When the three brothers drew lots for the cosmos, Zeus won the sky, Hades the underworld, and Poseidon the sea — yet Poseidon always coveted the land. He contested Athens with Athena, striking the Acropolis with his trident to produce a salt spring. Athena offered the olive tree, and the people chose her gift. Enraged, Poseidon flooded the Thriasian plain. He also fought for Corinth, for Argos, for Aegina — often losing to other gods. But beneath his pride lay fierce loyalty. He built the walls of Troy alongside Apollo, and when King Laomedon refused payment, Poseidon sent a sea monster. He guided Odysseus's son Telemachus and cursed Odysseus himself for blinding his son Polyphemus — demonstrating that the sea gives and the sea takes, and neither gift comes cheap."},
  {n:"Athena",c:"Greek",d:["Wisdom","Strategic War","Crafts","Justice"],r:"Goddess of wisdom and strategic warfare, born from Zeus's head fully armed. Patron of Athens, protector of heroes.",s:["Owl","Olive Tree","Aegis","Spear"],g:"f",rel:["Zeus","Ares","Odysseus","Perseus"],w:"Athena",
   story:"Athena's birth shook Olympus. Zeus had swallowed her mother Metis after a prophecy warned that Metis would bear children wiser than their father. But the wisdom grew inside him until a splitting headache drove him to command Hephaestus to split his skull with an axe. From the cleft leaped Athena — fully grown, clad in golden armor, her war-cry echoing to heaven and earth. She became Zeus's favorite child, the only one trusted with his thunderbolt and his aegis. She guided Perseus to slay Medusa by showing him her reflection in his shield. She taught Odysseus cunning when brute force failed. She wove the tapestry that depicted the gods' triumph over the giants — and when the mortal Arachne dared challenge her to a weaving contest, Athena destroyed the girl's blasphemous tapestry and transformed her into the first spider. Wisdom has sharp edges."},
  {n:"Apollo",c:"Greek",d:["Sun","Music","Prophecy","Healing","Archery"],r:"God of the sun, music, poetry, prophecy, and healing. Twin of Artemis, patron of the Oracle at Delphi where mortals hear the voice of fate.",s:["Lyre","Bow","Laurel Wreath","Raven"],g:"m",rel:["Artemis","Zeus","Dionysus","Asclepius"],w:"Apollo",
   story:"Apollo came into the world on the island of Delos, born beneath a palm tree while the island stood rooted at last in the sea. Only four days old, he demanded a bow and arrows and set out to find a place for his oracle. He chose Delphi, the navel of the world — but a great serpent, the Python, guarded the sacred spring. Young Apollo slew it with his first arrows and claimed the site. Yet the Python had been a child of Gaia herself, so Zeus commanded Apollo to purify himself and establish the Pythian Games in the serpent's honor. At Delphi, his priestess the Pythia breathed the vapors from the earth and spoke in riddles that shaped the fate of nations. But Apollo's gifts carried sorrow: he loved the nymph Daphne, and when she fled, he chased her until she transformed into a laurel tree — ever after his sacred plant, a crown of leaves that cannot love back."},
  {n:"Artemis",c:"Greek",d:["Hunt","Moon","Wilderness","Chastity","Childbirth"],r:"Goddess of the hunt and the moon, protector of wild things and young women. Twin of Apollo, she roams the mountains with her band of nymphs.",s:["Bow and Arrow","Deer","Crescent Moon","Hunting Dog"],g:"f",rel:["Apollo","Zeus","Leto","Orion"],w:"Artemis",
   story:"When Leto labored on Delos, Artemis was born first — and at only minutes old, she helped her mother deliver Apollo. This is why she became the goddess of childbirth even though she swore never to bear children herself. As a young girl, she sat on Zeus's knee and asked for six wishes: a bow and arrows, a chorus of nymphs, a tunic short enough to run in, all the mountains of the earth, a single city, and eternal chastity. Zeus granted every one. Artemis roams the wild places where no man rules, and those who intrude suffer her wrath. Actaeon, the hunter who accidentally saw her bathing, she transformed into a stag — and his own hounds tore him apart. Yet she could show tenderness: she protected the young, she cared for the weak, and when Orion the hunter died — whether by her own arrow or Apollo's trick — she set him among the stars."},
  {n:"Aphrodite",c:"Greek",d:["Love","Beauty","Desire","Procreation"],r:"Goddess of love and beauty, born from sea foam where Uranus's severed remains fell. Her power over desire affects gods and mortals alike.",s:["Dove","Rose","Myrtle","Sparrow"],g:"f",rel:["Hephaestus","Ares","Eros","Anchises"],w:"Aphrodite",
   story:"Aphrodite's origin is written in blood and sea-foam. When Cronus castrated his father Uranus and cast the remains into the ocean, the water churned white around the immortal flesh, and from this divine foam Aphrodite rose — the most beautiful being in existence. She stepped ashore on Cyprus, and where her feet touched the ground, flowers bloomed. The gods feared her power would cause chaos, so Zeus married her off to Hephaestus, the lame smith-god. But Aphrodite loved Ares, god of war, and their affair was exposed when Hephaestus crafted an invisible net that trapped them in bed together — and invited all the gods to witness their shame. Yet Aphrodite was not merely vain. In the Trojan War, she protected Paris and saved Aeneas from death, because the judgment that began the war was ultimately her own. Love, she teaches, is not gentle — it is the most dangerous force in the universe."},
  {n:"Ares",c:"Greek",d:["War","Bloodshed","Violence","Courage"],r:"God of brutal warfare and bloodshed. Represented the chaotic, violent reality of battle, unlike strategic Athena.",s:["Spear","Vulture","Dog","Burning Torch"],g:"m",rel:["Zeus","Hera","Aphrodite","Enyo"],w:"Ares",
   story:"Ares is the god no one loves — not even his own father. Zeus called him 'most hateful of all the gods who hold Olympus,' for Ares represents war not as strategy but as butchery. He fights without loyalty, switching sides for the thrill of slaughter. Yet even Ares has his stories. When the giants Otus and Ephialtes trapped him in a bronze jar for thirteen months, it was Hermes who rescued him, and only because the world had grown dangerously quiet without war. His love affair with Aphrodite produced children including Eros (desire), Phobos (fear), and Deimos (terror) — the eternal companions of every battlefield. The Spartans honored him above all gods, sacrificing puppies in his name before battle. The Romans, who called him Mars, elevated him to father of their nation. Perhaps the truth is that no civilization, however refined, can pretend that violence does not exist."},
  {n:"Hades",c:"Greek",d:["Underworld","Death","Wealth","Boundaries"],r:"God of the underworld and ruler of the dead. Not evil — he ensures mortals stay dead and cosmic boundaries are respected.",s:["Cerberus","Scepter","Helm of Darkness","Key"],g:"m",rel:["Zeus","Poseidon","Persephone","Demeter"],w:"Hades",
   story:"Hades drew the worst lot — the underworld — and made it his kingdom. Unlike his brothers, he rarely leaves his realm. He sits on a throne of ebony, beside Persephone (whom he abducted with Zeus's permission), and judges the dead alongside Minos and Rhadamanthus. The underworld has five rivers: Styx (hatred), Lethe (forgetfulness), Acheron (sorrow), Phlegethon (fire), and Cocytus (wailing). The dead must cross the Styx, paying Charon the ferryman with a coin placed on their tongue in life. Cerberus, the three-headed hound, guards the gate — letting souls in, letting nothing out. Hades owns the Helm of Darkness, which makes its wearer invisible, and he lent it to Perseus and Athena. When Orpheus came to reclaim Eurydice, Hades was moved to tears — the only time the lord of death showed mercy. But Orpheus looked back, and the condition was broken. Hades is not cruel. He is simply the final word."},
  {n:"Odin",c:"Norse",d:["Wisdom","War","Poetry","Death","Magic"],r:"All-Father, chief of the Aesir. Sacrificed his eye for wisdom and hung himself on Yggdrasil for nine nights to learn the runes.",s:["Gungnir","Ravens (Huginn & Muninn)","Sleipnir","Valknut"],g:"m",rel:["Thor","Loki","Frigg","Baldur","Vidar"],w:"Odin",
   story:"Odin's hunger for wisdom has no limit. He gave his right eye to Mimir to drink from the well of wisdom — and Mimir's head still counsels him. He hung himself from Yggdrasil, the World Tree, for nine nights with a spear in his side, sacrificing himself to himself, until the runes revealed themselves. He stole the Mead of Poetry from the giants, taking the form of a serpent and then an eagle, and he spat it out as inspiration for poets and skalds. He rides Sleipnir, the eight-legged horse, through all nine worlds. His ravens Huginn (Thought) and Muninn (Memory) fly out each dawn and return each evening to whisper what they've seen. Yet for all his wisdom, he cannot prevent Ragnarok — only delay it. He gathers the bravest fallen warriors to Valhalla, where they fight all day and feast all night, preparing for the final battle where Odin will be swallowed by the wolf Fenrir. Even the All-Father knows that some fates cannot be escaped."},
  {n:"Thor",c:"Norse",d:["Thunder","Storms","Strength","Protection"],r:"God of thunder, protector of Midgard and mankind. Wields Mjolnir, the mighty hammer that always returns to his hand.",s:["Mjolnir","Goats (Tanngrisnir & Tanngnjostr)","Megingjord","Iron Gloves"],g:"m",rel:["Odin","Loki","Sif","Jormungandr"],w:"Thor",
   story:"Thor is the god the common people loved most — not because of wisdom or poetry, but because he gets things done. When the giant Thrym stole Mjolnir and demanded Freya as his bride, Thor disguised himself in a wedding dress and veil, took Loki as his bridesmaid, and walked into the giant's hall. When Thrym placed Mjolnir in the bride's hands as was custom, Thor threw off the veil and slaughtered every giant in the hall. When he went fishing with the giant Hymir and his line caught the World Serpent Jormungandr, he braced his feet through the bottom of the boat and hauled the serpent up — but Hymir cut the line in terror. Thor's goats pull his chariot across the sky: he can kill and eat them each night, then resurrect them with Mjolnir the next morning, as long as no bones are broken. At Ragnarok, Thor and Jormungandr will meet one final time. Thor will kill the serpent, then walk nine steps before falling dead from its venom. The protector of mankind will fall — but not before ensuring the world has a chance to begin again."},
  {n:"Loki",c:"Norse",d:["Mischief","Trickery","Fire","Chaos","Shapeshifting"],r:"Trickster god, shapeshifter and chaos-bringer. Father of monsters, blood-brother of Odin, the cause and solution to every problem in Asgard.",s:["Serpent","Knot","Fly","Laufeyjarson"],g:"m",rel:["Odin","Thor","Sigyn","Fenrir","Hel","Jormungandr"],w:"Loki",
   story:"Loki is the god who makes stories happen — and the god who ends them. When Thor's hammer was stolen, it was Loki who discovered where and who. When the walls of Asgard needed building, it was Loki who solved the problem (after causing it). He shapeshifts into a fly, a salmon, a mare — he even became a mare and gave birth to Odin's eight-legged horse Sleipnir. He cut off Sif's golden hair and replaced it with dwarf-forged gold. He arranged the death of Baldur, the most beloved god, with a spear of mistletoe — the one thing in all the worlds that had not sworn to harm him. For this, the gods bound Loki to three rocks with the entrails of his son, and a serpent drips venom onto his face. His wife Sigyn catches the venom in a bowl, but when she must empty it, the drops that hit him make him writthe in agony — and the whole earth shakes. This is the Norse explanation for earthquakes. At Ragnarok, Loki will break free and lead the giants against the gods. He and Heimdall will kill each other. Even in death, Loki is the last punchline."},
  {n:"Freya",c:"Norse",d:["Love","Beauty","War","Magic (Seidr)","Fertility"],r:"Goddess of love, beauty, and war. Leader of the Valkyries, master of seidr magic. She claims half the battle-slain, Odin claims the other half.",s:["Brisingamen","Falcon Cloak","Cats","Boar Hildisvini"],g:"f",rel:["Freyr","Odin","Odr","Hnoss"],w:"Freya",
   story:"Freya's necklace Brisingamen was bought at a price no other goddess would pay. Four dwarves forged it, and each demanded a night with her as payment. She agreed — and when Odin learned of it, he ordered Loki to steal the necklace in her sleep. Freya confronted Odin, who demanded an impossible price for its return: she must stir up eternal war between two kings, with the dead rising each night to fight again. This she did, and the battle rages still. Freya rides a chariot pulled by two enormous cats, and she owns a cloak of falcon feathers that lets her fly between the worlds. She is the most powerful practitioner of seidr — the magic that sees the future and twists fate. When she weeps, her tears turn to gold on land and amber in the sea. Her husband Odr wandered away long ago, and she seeks him always, weeping as she searches. Half the warriors who die in battle come to her hall Sessrumnir — the other half go to Odin's Valhalla."},
  {n:"Ra",c:"Egyptian",d:["Sun","Creation","Kingship","Light"],r:"Sun god, king of the Egyptian pantheon. Sails across the sky by day and battles the serpent Apophis in the underworld by night.",s:["Sun Disk","Falcon","Obelisk","Ankh"],g:"m",rel:["Osiris","Set","Horus","Thoth","Sekhmet"],w:"Ra",
   story:"In the beginning, there was Nun — the primordial waters. From Nun, Ra created himself, then created Shu (air) and Tefnut (moisture), from whom all life descended. Each morning, Ra rises in his solar barque and sails across the sky, bringing light to the world. Each evening, he descends into the Duat — the underworld — where the twelve hours of night hold terrifying dangers. In the seventh hour, Apophis, the colossal serpent of chaos, attacks. Every single night, Ra must defeat it or the sun will never rise again. When Ra grew old, mortals mocked him, so he sent his Eye — the goddess Sekhmet — to punish them. She slaughtered so many that Ra regretted his command and dyed beer red like blood. Sekhmet drank it, fell asleep, and awoke as the gentler Hathor. Eventually, Ra retreated to the heavens, leaving the throne to his grandson Osiris, but his daily journey continues — the eternal cycle of light against darkness."},
  {n:"Osiris",c:"Egyptian",d:["Underworld","Resurrection","Fertility","Judgement"],r:"God of the dead and resurrection. Murdered and dismembered by Set, reassembled by Isis. He judges the dead in the Hall of Truth.",s:["Crook and Flail","Djed Pillar","Atef Crown","Green Skin"],g:"m",rel:["Isis","Set","Horus","Nephthys","Anubis"],w:"Osiris",
   story:"Osiris was once a beloved king of Egypt who taught humanity agriculture, law, and civilization. His brother Set, consumed by jealousy, devised a cunning trap: a magnificent chest crafted to fit Osiris perfectly. At a banquet, Set offered the chest to whoever it fit — and when Osiris lay inside, Set's accomplices sealed it and threw it into the Nile. Isis searched the world and found the chest embedded in a tree in Byblos. But Set found it too, and this time he dismembered Osiris into fourteen pieces and scattered them across Egypt. Isis and Nephthys searched again, finding every piece — except one. Isis fashioned a replacement, used her magic to reassemble Osiris, and conceived their son Horus. Osiris could not return to the living world, but he descended to the Duat and became its king — the judge before whom every soul must stand. The heart of the deceased is weighed against the feather of Maat. If the heart is lighter, eternal life awaits. If not, the monster Ammit devours it."},
  {n:"Isis",c:"Egyptian",d:["Magic","Motherhood","Healing","Protection"],r:"Goddess of magic and motherhood, the most powerful magician among the gods. She reassembled Osiris and protected Horus from every danger.",s:["Throne","Ankh","Tyet Knot","Sycamore"],g:"f",rel:["Osiris","Horus","Set","Nephthys"],w:"Isis",

// ============================================================
// NLP ENGINE (built-in, zero dependencies)
// ============================================================
class NLP {
  constructor(){
    this.fm={};
    DB.forEach(f=>{this.fm[f.n.toLowerCase()]=f});
    this.ck=Object.keys(CUL).map(c=>c.toLowerCase());
  }
  process(input){
    try{
      const l=(input||"").toLowerCase().trim();
      const tk=l.split(/\s+/).filter(t=>t.length>0);
      return{intent:this.ci(l,tk),entities:this.ee(l,tk),tokens:tk,original:input};
    }catch(e){return{intent:"general",entities:{figures:[],cultures:[],pronouns:[]},tokens:[],original:input}}
  }
  ci(l,tk){
    const s={};
    if(tk.some(t=>['hello','hi','hey','greetings','howdy','yo','hola'].includes(t)))s.greeting=3;
    if(['who is','who are','tell me about','what is','describe','explain','info on','more about','know about','tell me more'].some(p=>l.includes(p)))s.ask=3;
    if(['compare','difference between',' vs ',' versus ','similarities','how are they different','how are they similar'].some(p=>l.includes(p)))s.compare=3;
    if(['list','show me','names of','gods of','deities of','who are the','figures in','pantheon','all the'].some(p=>l.includes(p)))s.list=2;
    if(['tell me a story','narrate','myth about','legend of','tale of','tell the story','saga','epic','story of'].some(p=>l.includes(p)))s.story=3;
    if(['save','bookmark','add to collection','remember this','store this'].some(p=>l.includes(p)))s.save=2;
    if(['my collection','show collection','saved items','favorites','bookmarks','what have i saved'].some(p=>l.includes(p)))s.view=2;
    if(['help','what can you do','how to use','instructions','guide','what do you know'].some(p=>l.includes(p)))s.help=3;
    if(['thanks','thank you','appreciated','awesome','great answer','cool','nice','wonderful','fascinating','interesting'].some(p=>l.includes(p)))s.thanks=2;
    if(['bye','goodbye','see you','farewell'].some(p=>l.includes(p)))s.bye=3;
    if(this.ff(l).length>0&&!s.ask&&!s.compare)s.ask=1;
    if(this.fc(l).length>0&&!s.list&&!s.ask)s.list=1;
    const sorted=Object.entries(s).sort((a,b)=>b[1]-a[1]);
    return sorted.length>0?sorted[0][0]:'general';
  }
  ee(l,tk){return{figures:this.ff(l),cultures:this.fc(l),pronouns:this.fp(tk)}}
  ff(l){const f=[];for(const n of Object.keys(this.fm)){const rx=new RegExp('\\b'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b');if(rx.test(l))f.push(this.fm[n])}return f}
  fc(l){return this.ck.filter(c=>l.includes(c)).map(c=>c.charAt(0).toUpperCase()+c.slice(1))}
  fp(tk){const p=[];if(tk.some(t=>['he','him','his'].includes(t)))p.push('m');if(tk.some(t=>['she','her','hers'].includes(t)))p.push('f');return p}
}

// ============================================================
// CONTEXT MANAGER
// ============================================================
class CTX {
  constructor(){this.reset()}
  reset(){this.cf=null;this.cc=null;this.mf=[];this.flow='idle';this.li=null}
  update(nr){
    try{
      const{intent:i,entities:e}=nr;this.li=i;
      if(e.pronouns.length>0&&this.cf&&e.figures.length===0)nr.entities.figures=[this.cf];
      if(e.figures.length>0){
        if(e.figures.length>=2)this.flow='comparing';
        else{this.cf=e.figures[0];this.flow='exploring';if(!this.mf.find(f=>f.n===this.cf.n))this.mf.push(this.cf)}
      }
      if(e.cultures.length>0)this.cc=e.cultures[0];
      else if(this.cf)this.cc=this.cf.c;
      if(i==='story')this.flow='storytelling';
      if(i==='greeting'||i==='bye')this.flow='idle';
      if(['ask','story'].includes(i)&&e.figures.length===0&&this.cf)nr.entities.figures=[this.cf];
    }catch(e){console.error("CTX error:",e)}
  }
  gs(){
    let c='';
    if(this.cf)c+=`Discussing: ${this.cf.n} (${this.cf.c}). `;
    if(this.cc)c+=`Culture: ${this.cc}. `;
    if(this.mf.length>0)c+=`Mentioned: ${this.mf.map(f=>f.n).join(', ')}. `;
    return c;
  }
}

// ============================================================
// DATABASE (IndexedDB)
// ============================================================
class DB_ {
  constructor(){this.db=null}
  async init(){
    return new Promise((res,rej)=>{
      const r=indexedDB.open('LoreKeeperDB',1);
      r.onupgradeneeded=e=>{
        const d=e.target.result;
        if(!d.objectStoreNames.contains('msg'))d.createObjectStore('msg',{keyPath:'id',autoIncrement:true});
        if(!d.objectStoreNames.contains('col')){const s=d.createObjectStore('col',{keyPath:'id',autoIncrement:true});s.createIndex('name','name',{unique:false})}
      };
      r.onsuccess=e=>{this.db=e.target.result;res()};r.onerror=e=>rej(e.target.error);
    });
  }
  async sm(role,content,meta={}){
    try{const tx=this.db.transaction('msg','readwrite');tx.objectStore('msg').add({role,content,meta,ts:Date.now()});return new Promise(r=>{tx.oncomplete=()=>r()})}catch(e){}
  }
  async gm(lim=50){
    try{const tx=this.db.transaction('msg','readonly');const rq=tx.objectStore('msg').getAll();return new Promise(r=>{rq.onsuccess=()=>r(rq.result.slice(-lim));rq.onerror=()=>r([])})}catch(e){return[]}
  }
  async cm(){try{const tx=this.db.transaction('msg','readwrite');tx.objectStore('msg').clear();return new Promise(r=>{tx.oncomplete=()=>r()})}catch(e){}}
  async sc(fig){
    try{const ex=await this.gc();if(ex.find(f=>f.name===fig.n))return false;const tx=this.db.transaction('col','readwrite');tx.objectStore('col').add({name:fig.n,culture:fig.c,domain:fig.d,role:fig.r,savedAt:Date.now()});return new Promise(r=>{tx.oncomplete=()=>r(true);tx.onerror=()=>r(false)})}catch(e){return false}
  }
  async gc(){
    try{const tx=this.db.transaction('col','readonly');const rq=tx.objectStore('col').getAll();return new Promise(r=>{rq.onsuccess=()=>r(rq.result||[]);rq.onerror=()=>r([])})}catch(e){return[]}
  }
  async rc(id){try{const tx=this.db.transaction('col','readwrite');tx.objectStore('col').delete(id);return new Promise(r=>{tx.oncomplete=()=>r()})}catch(e){}}
  async ca(){try{const t1=this.db.transaction('msg','readwrite');t1.objectStore('msg').clear();const t2=this.db.transaction('col','readwrite');t2.objectStore('col').clear();await Promise.all([new Promise(r=>{t1.oncomplete=r}),new Promise(r=>{t2.oncomplete=r})])}catch(e){}}
}

// ============================================================
// WIKIPEDIA API (Free, optional enrichment)
// ============================================================
async function getWiki(query){
  try{
    const su=`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query+' mythology')}&utf8=&format=json&origin=*&srlimit=1`;
    const sr=await fetch(su,{signal:AbortSignal.timeout(6000)});
    const sd=await sr.json();
    if(!sd.query||!sd.query.search||!sd.query.search.length)return null;
    const t=sd.query.search[0].title;
    const mu=`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t)}`;
    const mr=await fetch(mu,{signal:AbortSignal.timeout(6000)});
    if(!mr.ok)return null;
    const md=await mr.json();
    return{title:md.title,extract:md.extract,thumbnail:md.thumbnail?md.thumbnail.source:null,url:md.content_urls?md.content_urls.desktop.page:null};
  }catch(e){return null}
}

// ============================================================
// RESPONSE GENERATOR — 100% local, always works
// ============================================================
class RG {
  constructor(nlp,ctx,db){this.nlp=nlp;this.ctx=ctx;this.db=db}

  async gen(input){
    try{
      const nr=this.nlp.process(input);
      this.ctx.update(nr);
      const{intent:i,entities:e}=nr;

      // Handle save/view locally
      if(i==='save'&&this.ctx.cf)return await this.hSave();
      if(i==='view')return await this.hView();

      const fig=e.figures.length>0?e.figures[0]:this.ctx.cf;
      const cul=e.cultures.length>0?e.cultures[0]:this.ctx.cc;

      // Try Wikipedia in background (non-blocking)
      let wiki=null;
      try{
        if(fig)wiki=await getWiki(fig.n);
        else if(cul)wiki=await getWiki(cul+' mythology');
      }catch(e){}

      // Generate primary response from local KB
      const text=this.gLocal(i,e,fig,cul);

      // Append Wikipedia enrichment if available and relevant
      let finalText=text;
      if(wiki&&wiki.extract&&i!=='greeting'&&i!=='thanks'&&i!=='bye'){
        const snippet=wiki.extract.length>400?wiki.extract.substring(0,400)+'...':wiki.extract;
        finalText+=`\n\n---\n\nFrom the ancient scrolls (Wikipedia):\n${snippet}`;
        if(wiki.url)finalText+=`\n\nRead more on Wikipedia`;
      }

      return{text:finalText,figure:fig,culture:cul,wiki,intent:i,source:wiki?'local+wiki':'local'};
    }catch(e){
      console.error("Gen error:",e);
      return{text:this.fallback(input),figure:this.ctx.cf,culture:this.ctx.cc,wiki:null,intent:'fallback',source:'local'};
    }
  }

  gLocal(i,e,fig,cul){
    switch(i){
      case 'greeting':
        return 'Welcome, seeker of ancient wisdom. I am **LoreKeeper**, guardian of myths and legends from across the ages. Ask me about any deity, hero, creature, or legend — or say **"guide me"** and I shall illuminate the paths that await you.\n\nI hold tales from **Greek**, **Norse**, **Egyptian**, **Japanese**, **Hindu**, **Celtic**, **Aztec**, and **Akan** traditions.';

      case 'ask':
        if(fig){
          const p=fig.g==='f'?'she':'he';
          const ps=fig.g==='f'?'her':'his';
          let resp=`**${fig.n}** — ${fig.r}\n\nIn ${fig.c} mythology, ${p} holds dominion over ${fig.d.join(', ')}. The sacred symbols of ${fig.n} include ${fig.s.join(', ')}. ${fig.n} is closely connected to ${fig.rel.slice(0,4).join(', ')}, ${ps} story woven into the very fabric of ${fig.c} belief.`;
          if(fig.story)resp+=`\n\nWould you like me to **tell the story** of ${fig.n}, or learn about ${fig.rel.slice(0,2).join(' or ')}?`;
          else resp+=`\n\nWould you like to learn about ${fig.rel.slice(0,2).join(' or ')}?`;
          return resp;
        }
        return 'The scrolls do not reveal that name clearly, seeker. Could you rephrase your question? I guard tales from **Greek**, **Norse**, **Egyptian**, **Japanese**, **Hindu**, **Celtic**, **Aztec**, and **Akan** traditions.';

      case 'list':
        if(cul&&CUL[cul]){
          const c=CUL[cul];
          return `**${cul} Mythology**\n\n${c.desc}\n\nKey figures: ${c.kf.map(f=>`**${f}**`).join(', ')}\n\nWhich one calls to you, seeker?`;
        }
        return 'I guard tales from many traditions:\n\n• **Greek** — Olympian gods, the Trojan War, the Labors of Hercules\n• **Norse** — Aesir and Vanir, Yggdrasil, Ragnarok\n• **Egyptian** — The sun, the afterlife, the weighing of the heart\n• **Japanese** — Kami spirits, the sun goddess, the storm god\n• **Hindu** — The Trimurti, the Ramayana, the Mahabharata\n• **Celtic** — The Tuatha De Danann, sacred groves, the Otherworld\n• **Aztec** — Five suns, the feathered serpent, cosmic sacrifice\n• **Akan** — Anansi the spider, the sky god Nyame\n\nWhich mythology calls to you?';

      case 'compare':
        if(e.figures.length>=2){
          const[f1,f2]=e.figures;
          const cd=f1.d.filter(d=>f2.d.includes(d));
          let resp=`**${f1.n}** (${f1.c}) vs **${f2.name||f2.n}** (${f2.c})\n\n`;
          resp+=`**${f1.n}** governs ${f1.d.join(', ')}, while **${f2.name||f2.n}** presides over ${f2.d.join(', ')}.`;
          if(cd.length>0)resp+=` They share dominion over **${cd.join(', ')}** — a fascinating parallel across cultures.`;
          resp+=`\n\n**${f1.n}** is symbolized by ${f1.s.join(', ')}, while **${f2.name||f2.n}** is associated with ${f2.s.join(', ')}.`;
          if(f1.g===f2.g)resp+=` Both are ${f1.g==='f'?'female':'male'} deities.`;
          resp+=`\n\nDespite arising from different cultures, both figures reveal how humanity grapples with the same fundamental forces. The sky-father, the trickster, the mother-goddess — these archetypes echo across every tradition because they answer questions that every civilization asks.`;
          return resp;
        }
        return 'To compare two figures, name them both — for example: **"Compare Thor and Zeus"** or **"Difference between Athena and Freya"**. Which two shall I place side by side?';

      case 'story':
        if(fig&&fig.story){
          return `**The Legend of ${fig.n}**\n\n${fig.story}`;
        }
        if(fig){
          const p=fig.g==='f'?'she':'he';
          return `The tale of **${fig.n}** is one of the great legends of ${fig.c} mythology. ${p} is ${fig.r.toLowerCase()}, wielding power over ${fig.d.join(', ')} with ${fig.s[0]} as ${fig.g==='f'?'her':'his'} sacred symbol. Connected to ${fig.rel.slice(0,3).join(', ')}, ${fig.n}'s story echoes through the ages.\n\nAsk me about a related figure for more detailed tales!`;
        }
        if(cul&&CUL[cul])return `Let me weave a tale from ${cul} mythology...\n\n${CUL[cul].desc}\n\nName a specific figure and I shall recount their legend in full.`;
        return 'Name a figure or mythology, and I shall weave their tale. Try: **"Tell me a story about Zeus"** or **"Story of Norse mythology"**';

      case 'help':
        return `I am **LoreKeeper**, guardian of the world's mythologies. Here is what you can ask:\n\n• **"Tell me about Zeus"** — Learn about any deity\n• **"Compare Thor and Zeus"** — Find parallels\n• **"Tell me a story about Loki"** — Hear a full myth\n• **"List the Greek gods"** — Browse a pantheon\n• **"Save this to my collection"** — Bookmark figures\n• **"Show my collection"** — View saved figures\n\nI draw from **Greek**, **Norse**, **Egyptian**, **Japanese**, **Hindu**, **Celtic**, **Aztec**, and **Akan** traditions.\n\nPowered by local knowledge base + Wikipedia API.`;

      case 'thanks':
        return 'It is my purpose and pleasure, seeker. The ancient stories live on through those who seek them. Is there another tale that calls to you?';

      case 'bye':
        return 'Farewell, seeker. May the wisdom of the ancients light your path until we meet again. The stories will be here, waiting for your return.';

      default:
        if(fig){
          const p=fig.g==='f'?'she':'he';
          return `You speak of **${fig.n}** — ${fig.r}\n\nIn ${fig.c} mythology, ${p} rules over ${fig.d.join(', ')}. Sacred symbols include ${fig.s.join(', ')}. What would you like to know about ${fig.n}?`;
        }
        if(cul)return `Ah, **${cul} mythology** — a rich and ancient tradition. ${CUL[cul]?CUL[cul].desc:''}\n\nWould you like me to list the key figures?`;
        return 'The ancient scrolls do not reveal a clear answer, seeker. Could you rephrase, or ask about a specific deity, culture, or myth? Type **"help"** to see what I can guide you through.';
    }
  }

  fallback(input){
    if(this.ctx.cf){
      const f=this.ctx.cf;
      return `**${f.n}** — ${f.r}\n\nDomain: ${f.d.join(', ')}\nSymbols: ${f.s.join(', ')}\nCulture: ${f.c}\nRelated: ${f.rel.join(', ')}\n\nThe deeper scrolls are temporarily beyond reach, but this knowledge I can share.`;
    }
    return 'The scrolls are restless, seeker, but I still guard their wisdom. Ask me about a specific deity or mythology — try **"Tell me about Zeus"** or **"List the Norse gods"**.';
  }

  async hSave(){
    const fig=this.ctx.cf;
    if(!fig)return{text:'I am not sure what you would like me to save. Discuss a figure first, then say "save this".',intent:'save',figure:null,source:'local'};
    const saved=await this.db.sc(fig);
    if(saved){sToast(`${fig.n} saved to collection`,'success');return{text:`**${fig.n}** has been inscribed in your collection. View saved figures in the sidebar.`,intent:'save',figure:fig,source:'local'}}
    sToast(`${fig.n} already in collection`,'info');return{text:`**${fig.n}** is already in your collection. Perhaps another figure calls to you?`,intent:'save',figure:fig,source:'local'}
  }

  async hView(){
    const col=await this.db.gc();
    if(!col.length)return{text:'Your collection is empty. Discuss a figure and say "save this" to bookmark them.',intent:'view',figure:null,source:'local'};
    const list=col.map(f=>`• **${f.name}** (${f.culture}) — ${f.domain?f.domain.join(', '):''}`).join('\n');
    return{text:`Your collection, seeker:\n\n${list}\n\nClick any figure in the sidebar to revisit their tales.`,intent:'view',figure:null,source:'local'};
  }
}

// ============================================================
// PARTICLES
// ============================================================
class PS {
  constructor(c){this.c=c;this.x=c.getContext('2d');this.p=[];this.rs();window.addEventListener('resize',()=>this.rs());this.in();this.an()}
  rs(){this.c.width=window.innerWidth;this.c.height=window.innerHeight}
  in(){this.p=[];const n=Math.min(45,Math.floor(window.innerWidth/30));for(let i=0;i<n;i++)this.p.push({x:Math.random()*this.c.width,y:Math.random()*this.c.height,sz:Math.random()*2+.5,sy:-(Math.random()*.3+.1),sx:(Math.random()-.5)*.2,o:Math.random()*.5+.1,ph:Math.random()*Math.PI*2,ps:Math.random()*.02+.005})}
  an(){this.x.clearRect(0,0,this.c.width,this.c.height);for(const p of this.p){p.x+=p.sx;p.y+=p.sy;p.ph+=p.ps;const co=p.o*(.5+.5*Math.sin(p.ph));if(p.y<-10)p.y=this.c.height+10;if(p.x<-10)p.x=this.c.width+10;if(p.x>this.c.width+10)p.x=-10;const g=this.x.createRadialGradient(p.x,p.y,0,p.x,p.y,Math.max(.1,p.sz*3));g.addColorStop(0,`rgba(196,149,48,${co})`);g.addColorStop(.5,`rgba(196,149,48,${co*.3})`);g.addColorStop(1,`rgba(196,149,48,0)`);this.x.beginPath();this.x.arc(p.x,p.y,Math.max(.1,p.sz*3),0,Math.PI*2);this.x.fillStyle=g;this.x.fill()}requestAnimationFrame(()=>this.an())}
}

// ============================================================
// GLOBAL APP
// ============================================================
let _db,_nlp,_ctx,_rg;
let _proc=false;

async function initApp(){
  try{
    _db=new DB_();await _db.init();
    _nlp=new NLP();_ctx=new CTX();_rg=new RG(_nlp,_ctx,_db);
    new PS(document.getElementById('pc'));
    showWelcome();rCol();rHis();
    const pm=await _db.gm(20);
    if(pm.length>0){for(const m of pm)amUI(m.role,m.content,m.meta||{},false);sToast('Previous conversation restored','info')}
    showChips();
  }catch(e){console.error("Init error:",e);sToast('Init failed: '+e.message,'error')}
}

function showWelcome(){
  document.getElementById('cm').innerHTML=`
  <div class="mi max-w-2xl mx-auto"><div class="flex gap-3">
    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-[var(--acc)] to-amber-700 flex items-center justify-center flex-shrink-0 mt-1"><i class="fas fa-book-open text-[var(--bg)] text-sm"></i></div>
    <div class="space-y-3"><div class="bg-[var(--bot)] border border-[var(--bdr)] rounded-2xl rounded-tl-sm px-5 py-4 text-sm leading-relaxed">
      <p class="fd text-[var(--acc)] text-base mb-2">Welcome, Seeker</p>
      <p class="text-[var(--fg)]">I am <strong class="text-[var(--acc)]">LoreKeeper</strong>, the ancient guardian of myths, legends, and folklore from cultures across the world. Ask me about any deity, hero, creature, or legend — or say <em>"guide me"</em> and I shall illuminate the paths that await you.</p>
      <div class="mt-3 pt-3 border-t border-[var(--bdr)] flex flex-wrap gap-3 text-[var(--fg2)] text-xs">
        <span class="inline-flex items-center gap-1"><i class="fas fa-brain"></i> NLP Engine</span>
        <span class="inline-flex items-center gap-1"><i class="fas fa-database"></i> IndexedDB</span>
        <span class="inline-flex items-center gap-1"><i class="fas fa-globe"></i> Wikipedia API</span>
        <span class="inline-flex items-center gap-1"><i class="fas fa-scroll"></i> Local Knowledge</span>
      </div>
    </div></div>
  </div></div>`;
}

function showChips(){
  const ch=[
    {t:'Tell me about Norse gods',i:'fa-hammer'},
    {t:'Who is Amaterasu?',i:'fa-sun'},
    {t:'Compare Zeus and Odin',i:'fa-arrows-left-right'},
    {t:'Story of Loki',i:'fa-scroll'},
    {t:'List Hindu deities',i:'fa-om'},
    {t:'Who is Anansi?',i:'fa-spider'}
  ];
  document.getElementById('qc').innerHTML=ch.map(c=>`<button class="ch inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-[var(--bdr)] text-xs text-[var(--fg2)] bg-[var(--card)]" onclick="sqc('${c.t.replace(/'/g,"\\'")}')"><i class="fas ${c.i}" style="font-size:10px"></i> ${c.t}</button>`).join('');
}

function sqc(t){document.getElementById('ci').value=t;sm()}

async function sm(){
  if(_proc)return;
  const input=document.getElementById('ci').value.trim();
  if(!input)return;
  _proc=true;
  const el=document.getElementById('ci');el.value='';ars(el);
  amUI('user',input);await _db.sm('user',input);
  sTyp();
  try{
    const r=await _rg.gen(input);
    rTyp();
    amUI('assistant',r.text,{figure:r.figure?r.figure.n:null,culture:r.culture,wiki:r.wiki,intent:r.intent,source:r.source});
    await _db.sm('assistant',r.text,{figure:r.figure?r.figure.n:null,culture:r.culture,intent:r.intent,source:r.source});
    if(r.intent==='save'||r.intent==='view')rCol();
    uChips(r);
  }catch(e){
    rTyp();amUI('assistant','The scrolls flickered for a moment, but I am still here. Please try asking again.');console.error(e);
  }
  _proc=false;
}

function amUI(role,content,meta={},anim=true){
  const c=document.getElementById('cm');const w=document.createElement('div');w.className=`max-w-2xl mx-auto ${anim?'mi':''}`;
  if(role==='user'){
    w.innerHTML=`<div class="flex gap-3 justify-end"><div class="bg-[var(--usr)] border border-[var(--bdr)] rounded-2xl rounded-tr-sm px-5 py-3 text-sm leading-relaxed max-w-[80%]">${esc(content)}</div><div class="w-9 h-9 rounded-lg bg-[var(--card)] border border-[var(--bdr)] flex items-center justify-center flex-shrink-0 mt-1"><i class="fas fa-user text-[var(--fg2)] text-sm"></i></div></div>`;
  }else{
    let fc='';
    if(meta.figure){const fig=DB.find(f=>f.n===meta.figure);if(fig){
      fc=`<div class="fc mt-3 p-4"><div class="flex items-start justify-between mb-2"><div><h4 class="fd text-[var(--acc)] text-sm">${fig.n}</h4><span class="text-xs text-[var(--fg2)] bg-[var(--bg)] px-2 py-0.5 rounded-full inline-block mt-1">${fig.c}</span></div><button class="ch text-[var(--fg2)] hover:text-[var(--acc)] text-xs" onclick="sfc('${fig.n}')" title="Save"><i class="far fa-bookmark"></i></button></div><p class="text-xs text-[var(--fg2)] mb-2">${fig.r}</p><div class="flex flex-wrap gap-1">${fig.d.map(d=>`<span class="text-[10px] px-2 py-0.5 rounded-full border border-[var(--bdr)] text-[var(--fg2)]">${d}</span>`).join('')}</div><div class="mt-2 text-[10px] text-[var(--fg2)]"><i class="fas fa-shapes mr-1"></i>${fig.s.join(', ')}</div>${fig.rel.length?`<div class="mt-1 text-[10px] text-[var(--fg2)]"><i class="fas fa-link mr-1"></i>${fig.rel.slice(0,4).join(', ')}</div>`:''}${meta.wiki&&meta.wiki.url?`<a href="${meta.wiki.url}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 mt-2 text-[10px] text-[var(--acc)] hover:underline"><i class="fas fa-external-link-alt"></i> Wikipedia</a>`:''}</div>`;
    }}
    let sb='';
    if(meta.source==='local+wiki')sb='<span class="sb bg-blue-900/50 text-blue-300 border border-blue-700 mt-2"><i class="fas fa-globe"></i> Local + Wikipedia</span>';
    else sb='<span class="sb bg-amber-900/50 text-amber-300 border border-amber-700 mt-2"><i class="fas fa-scroll"></i> Local Knowledge</span>';

    w.innerHTML=`<div class="flex gap-3"><div class="w-9 h-9 rounded-lg bg-gradient-to-br from-[var(--acc)] to-amber-700 flex items-center justify-center flex-shrink-0 mt-1"><i class="fas fa-book-open text-[var(--bg)] text-sm"></i></div><div class="min-w-0"><div class="bg-[var(--bot)] border border-[var(--bdr)] rounded-2xl rounded-tl-sm px-5 py-3 text-sm leading-relaxed">${fmt(content)}</div>${fc}<div class="mt-1">${sb}</div></div></div>`;
  }
  c.appendChild(w);c.scrollTop=c.scrollHeight;
}

function fmt(t){let h=esc(t);h=h.replace(/\*\*(.*?)\*\*/g,'<strong class="text-[var(--acc)]">$1</strong>');h=h.replace(/\*(.*?)\*/g,'<em>$1</em>');h=h.replace(/^---$/gm,'<hr class="border-[var(--bdr)] my-2">');h=h.replace(/^[•\-]\s+(.+)$/gm,'<div class="flex gap-2 ml-2"><span class="text-[var(--acc)]">•</span><span>$1</span></div>');h=h.replace(/\n\n/g,'</p><p class="mt-2">');h=h.replace(/\n/g,'<br>');return h}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function sTyp(){const c=document.getElementById('cm');const d=document.createElement('div');d.id='tyi';d.className='max-w-2xl mx-auto mi';d.innerHTML=`<div class="flex gap-3"><div class="w-9 h-9 rounded-lg bg-gradient-to-br from-[var(--acc)] to-amber-700 flex items-center justify-center flex-shrink-0"><i class="fas fa-book-open text-[var(--bg)] text-sm"></i></div><div class="bg-[var(--bot)] border border-[var(--bdr)] rounded-2xl rounded-tl-sm px-5 py-4"><div class="flex gap-1.5"><div class="td"></div><div class="td"></div><div class="td"></div></div></div></div>`;c.appendChild(d);c.scrollTop=c.scrollHeight}
function rTyp(){const d=document.getElementById('tyi');if(d)d.remove()}
function uChips(r){
  const s=[];
  if(r.figure&&r.figure.rel)s.push(...r.figure.rel.slice(0,2).map(f=>({t:`Tell me about ${f}`,i:'fa-user'})));
  if(r.culture)s.push({t:`More about ${r.culture} mythology`,i:'fa-globe'});
  if(r.figure){s.push({t:`Tell me a story about ${r.figure.n}`,i:'fa-scroll'});s.push({t:`Save ${r.figure.n} to collection`,i:'fa-bookmark'})}
  document.getElementById('qc').innerHTML=s.slice(0,4).map(c=>`<button class="ch inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-[var(--bdr)] text-xs text-[var(--fg2)] bg-[var(--card)]" onclick="sqc('${c.t.replace(/'/g,"\\'")}')"><i class="fas ${c.i}" style="font-size:10px"></i> ${c.t}</button>`).join('');
}
function tsb(o){document.getElementById('sb').classList.toggle('op',o);document.getElementById('sov').classList.toggle('op',o)}
function st(t){document.querySelectorAll('.tb').forEach(b=>{b.classList.toggle('ac',b.dataset.t===t);b.classList.toggle('text-[var(--fg2)]',b.dataset.t!==t)});document.getElementById('tcol').classList.toggle('hidden',t!=='col');document.getElementById('this').classList.toggle('hidden',t!=='his')}
async function rCol(){
  const col=await _db.gc();const c=document.getElementById('cl');
  if(!col.length){c.innerHTML='<div class="text-center py-8 text-[var(--fg2)] text-sm"><i class="far fa-bookmark text-2xl mb-2 block opacity-40"></i><p>No saved figures yet</p><p class="text-xs mt-1">Discuss a figure and say "save this"</p></div>';return}
  c.innerHTML=col.map(i=>`<div class="ci p-3 rounded-lg border border-[var(--bdr)] mb-2 cursor-pointer" onclick="aaf('${i.name}')"><div class="flex items-start justify-between"><div><h4 class="fd text-sm text-[var(--acc)]">${i.name}</h4><span class="text-[10px] text-[var(--fg2)] bg-[var(--bg)] px-1.5 py-0.5 rounded-full">${i.culture}</span></div><button onclick="event.stopPropagation();rfc(${i.id})" class="text-[var(--fg2)] hover:text-[var(--err)] text-xs"><i class="fas fa-xmark"></i></button></div><p class="text-xs text-[var(--fg2)] mt-1 line-clamp-1">${i.domain?i.domain.join(', '):''}</p></div>`).join('');
}
async function rHis(){
  const ms=await _db.gm(30);const c=document.getElementById('hl');const um=ms.filter(m=>m.role==='user');
  if(!um.length){c.innerHTML='<div class="text-center py-8 text-[var(--fg2)] text-sm"><i class="fas fa-clock-rotate-left text-2xl mb-2 block opacity-40"></i><p>No history yet</p></div>';return}
  c.innerHTML=um.reverse().slice(0,15).map(m=>`<div class="ci p-3 rounded-lg border border-[var(--bdr)] mb-2 cursor-pointer" onclick="aaf('${esc(m.content).replace(/'/g,"\\'")}')"><p class="text-xs text-[var(--fg)] line-clamp-2">${esc(m.content)}</p><span class="text-[10px] text-[var(--fg2)] mt-1 block">${new Date(m.ts).toLocaleString()}</span></div>`).join('');
}
function aaf(n){document.getElementById('ci').value=`Tell me about ${n}`;tsb(false);sm()}
async function sfc(n){const fig=DB.find(f=>f.n===n);if(fig){const s=await _db.sc(fig);sToast(s?`${n} saved to collection`:`${n} already in collection`,s?'success':'info');if(s)rCol()}}
async function rfc(id){await _db.rc(id);rCol();sToast('Removed from collection','info')}
async function cc(){await _db.cm();_ctx.reset();showWelcome();showChips();sToast('Chat cleared','info')}
async function cad(){await _db.ca();_ctx.reset();showWelcome();showChips();rCol();rHis();sToast('All data cleared','info')}
function ec(){
  const ms=document.querySelectorAll('#cm > div');let t='LoreKeeper Conversation Export\n'+'='.repeat(40)+'\n\n';
  ms.forEach(m=>{const ct=m.querySelector('[class*="rounded-2xl"]')?.textContent||'';const u=m.querySelector('.fa-user');if(ct.trim())t+=`${u?'You':'LoreKeeper'}: ${ct.trim()}\n\n`});
  const b=new Blob([t],{type:'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`lorekeeper-${new Date().toISOString().slice(0,10)}.txt`;a.click();URL.revokeObjectURL(u);sToast('Chat exported','success')
}
function hik(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sm()}}
function ars(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}
function sToast(msg,type='info'){
  const c=document.getElementById('tc');const t=document.createElement('div');
  const cl={success:'border-emerald-500 bg-emerald-900/80',info:'border-amber-500 bg-amber-900/80',error:'border-red-500 bg-red-900/80'};
  const ic={success:'fa-check-circle text-emerald-400',info:'fa-info-circle text-amber-400',error:'fa-exclamation-circle text-red-400'};
  t.className=`to flex items-center gap-2 px-4 py-2.5 rounded-lg border ${cl[type]} text-sm text-white backdrop-blur-sm`;
  t.innerHTML=`<i class="fas ${ic[type]}"></i> ${msg}`;c.appendChild(t);setTimeout(()=>t.remove(),3200)
}
document.addEventListener('DOMContentLoaded',initApp);
</script>
